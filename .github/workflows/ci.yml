name: LoopLab verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: looplab-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: windows-latest
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Audit publish set
        run: node scripts/looplab-public-audit.mjs

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install sprite-tool dependencies
        run: python -m pip install --requirement scripts/requirements.txt

      - name: Smoke-test sprite tooling
        run: python scripts/normalize-dark-gray-sprite-strip.py --help

      - name: Lint
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run lint

      - name: Run unit and rendered verification
        run: npm test

    });
    homeSel.onchange = () => { pushHistory(); if (homeSel.value) o.home = homeSel.value; else delete o.home; bump(); };
    host.append(field('Home location', homeSel));

    /* ---- animation frames ---- */
    host.append(el('h2', null, 'Animation'));
    const sp = o.sprite;
    const cache = frameCache.get(o.id);
    if (sp && sp.frames && sp.frames.length) {
      host.append(kv('folder', sp.folder || '(root)'));
      host.append(kv('frames', sp.frames.length + (cache ? '' : ' — not loaded')));
      if (!cache) {
        host.append(el('div', 'none',
          'The frame list is saved, but the images are not. Re-pick the folder to preview them here.'));
      }
      const row = el('div', 'pair');
      row.append(field('FPS', numBox(sp.fps === undefined ? 8 : sp.fps, 1, v => {
        o.sprite.fps = Math.max(0, isNaN(v) ? 8 : v); startSpriteLoop(); bump();
      })));
      row.append(field('Scale', numBox(sp.scale === undefined ? 1 : sp.scale, 0.1, v => {
        o.sprite.scale = Math.max(0.05, isNaN(v) ? 1 : v); bump();
      })));
      host.append(row);
      const an = el('select');
      [['feet', 'feet on the point'], ['center', 'centred on the point']].forEach(([v, lbl]) => {
        const opt = el('option', null, lbl); opt.value = v;
        if ((sp.anchor || 'feet') === v) opt.selected = true;
        an.append(opt);
      });
      an.onchange = () => { pushHistory(); o.sprite.anchor = an.value; bump(); };
      host.append(field('Anchor', an));
      host.append(el('div', 'none', 'First frames: ' + sp.frames.slice(0, 3).join(', ') +
                                    (sp.frames.length > 3 ? ' …' : '')));
    } else {
      host.append(el('div', 'none',
        'Pick a folder of images and they become this character’s frames, sorted by filename. ' +
        'The map file records the folder and names — your game loads the images itself.'));
    }
    const fr = el('div', 'pair');
    fr.append(btn(sp && sp.frames ? 'Replace frames…' : 'Load frames…', null, () => {
      pendingFrameTarget = o;
      $('fileFrames').click();
    }));
    if (sp) {
      fr.append(btn('Clear', 'danger', () => {
        pushHistory(); releaseFrames(o.id); delete o.sprite; bump();
      }));
    }
    host.append(fr);
    if (cache) {
      const pv = btn(spritePreview ? 'Pause preview' : 'Play preview', spritePreview ? 'on' : null, () => {
        spritePreview = !spritePreview;
        if (spritePreview) startSpriteLoop(); else stopSpriteLoop();
        refreshInspector(true); draw();
      });
      host.append(pv);
    }

    /* ---- scripted behaviour ---- */
    host.append(el('h2', null, 'Behaviour'));
    const ai = o.ai || {};
    const bSel = el('select');
    [['idle', 'stand still'], ['patrol', 'walk a route'],
     ['wander', 'wander the paths'], ['visit', 'visit locations']].forEach(([v, lbl]) => {
      const opt = el('option', null, lbl); opt.value = v;
      if ((ai.behavior || 'idle') === v) opt.selected = true;
      bSel.append(opt);
    });
    bSel.onchange = () => {
      pushHistory();
      if (bSel.value === 'idle') delete o.ai;
      else o.ai = Object.assign({ speed: 20, pause: 1 }, o.ai, { behavior: bSel.value });
      bump();
    };
    host.append(field('Does', bSel));

    if (ai.behavior && ai.behavior !== 'idle') {
      const sp = el('div', 'pair');
      sp.append(field('Speed %/s', numBox(ai.speed === undefined ? 20 : ai.speed, 1, v => {
        o.ai.speed = Math.max(0.5, v || 20); bump();
      })));
      sp.append(field('Pause s', numBox(ai.pause === undefined ? 1 : ai.pause, 0.5, v => {
        o.ai.pause = Math.max(0, isNaN(v) ? 1 : v); bump();
      })));
      host.append(sp);

      if (ai.behavior === 'patrol') {
        const rm = el('select');
        [['custom', 'its own stops'], ['global', 'the shared route']].forEach(([v, lbl]) => {
          const opt = el('option', null, lbl); opt.value = v;
          if ((ai.routeMode || 'custom') === v) opt.selected = true;
          rm.append(opt);
        });
        rm.onchange = () => {
          pushHistory();
          if (rm.value === 'global') o.ai.routeMode = 'global'; else delete o.ai.routeMode;
          bump();
        };
        host.append(field('Walks', rm));

        const lp = el('label', 'chk');
        const cb = el('input'); cb.type = 'checkbox'; cb.checked = ai.loop !== false;
        cb.onchange = () => { pushHistory(); o.ai.loop = cb.checked; bump(); };
        lp.append(cb, document.createTextNode('Loop the route'));
        host.append(lp);

        if (ai.routeMode === 'global' && !(doc.globalRoute || []).length) {
          host.append(el('div', 'none', '⚠ The shared route is empty — set it with nothing selected.'));
        }
      }
      if (ai.behavior === 'visit') {
        host.append(el('div', 'none', 'Ticked locations only. None ticked = visits any of them.'));
        const wrap = el('div');
        doc.locations.forEach(b => {
          const l = el('label', 'chk');
          const cb = el('input'); cb.type = 'checkbox';
          cb.checked = (ai.targets || []).indexOf(b.id) !== -1;
          cb.onchange = () => {
            pushHistory();
            const t = new Set(o.ai.targets || []);
            cb.checked ? t.add(b.id) : t.delete(b.id);
            if (t.size) o.ai.targets = [...t]; else delete o.ai.targets;
            bump();
          };
          l.append(cb, document.createTextNode(b.name || b.id));
          wrap.append(l);
        });
        if (!doc.locations.length) wrap.append(el('div', 'none', 'No locations yet.'));
        host.append(wrap);
      }

      // Which parts of the network this character is allowed to use.
      host.append(el('h2', null, 'Uses layers'));
      host.append(el('div', 'none', 'None ticked = the whole network.'));
      const lw = el('div');
      doc.layers.forEach(l => {
        const lab = el('label', 'chk');
        const cb = el('input'); cb.type = 'checkbox';
        cb.checked = (ai.layers || []).indexOf(l.id) !== -1;
        cb.onchange = () => {
          pushHistory();
          const t = new Set(o.ai.layers || []);
          cb.checked ? t.add(l.id) : t.delete(l.id);
          if (t.size) o.ai.layers = [...t]; else delete o.ai.layers;
          bump();
        };
        const dot = el('span', 'swatch'); dot.style.background = l.color;
        lab.append(cb, dot, document.createTextNode(l.name));
        lw.append(lab);
      });
      host.append(lw);
    }

    if (!(ai.behavior === 'patrol' && ai.routeMode === 'global')) {
      host.append(el('h2', null, 'Its own stops'));
      routeEditor(host, () => o.route,
                  v => { if (v.length) o.route = v; else delete o.route; pushHistory(); }, o);
    }
    host.append(btn('Delete character', 'danger', () => { pushHistory(); deleteChar(o); bump(); }));
  }
}

/* ============================================================== chips ===== */

function refreshChips() {
  const host = $('chips');
  host.innerHTML = '';
  const items = []
    .concat(doc.areas.map(a => ({ o: a, cls: a.kind === 'blocked' ? 'b' : 'w', type: 'area',
                                  text: (a.kind === 'blocked' ? 'Blocked' : 'Walkable') + ' · ' + a.points.length,
                                  del: () => deleteArea(a) })))
    .concat(doc.locations.map(b => ({ o: b, cls: 'lo', type: 'location',
                                      text: b.name || b.id, del: () => deleteLoc(b) })))
    .concat(doc.characters.map(c => ({ o: c, cls: 'ch', type: 'character',
                                       text: c.name || c.id, del: () => deleteChar(c) })));
  if (!items.length) {
    host.innerHTML = '<span class="empty">Areas, locations and characters appear here as you add them.</span>';
    return;
  }
  for (const it of items) {
    const e = el('span', 'chip ' + it.cls + (isSel(it.o) ? ' sel' : ''));
    e.append(el('span', null, it.text));
    const x = el('button', 'x', '×');
    x.title = 'Delete';
    x.onclick = ev => { ev.stopPropagation(); pushHistory(); it.del(); pushHistory(); refreshAll(); };
    e.append(x);
    e.onclick = () => {
      sel = isSel(it.o) ? null : { type: it.type, ref: it.o };
      routeEdit = null;
      refreshAll();
    };
    host.append(e);
  }
}

function refreshWarnings() {
  const host = $('warn');
  host.innerHTML = '';
  const add = (text, ok) => host.append(el('span', ok ? 'ok' : null, text));
  if (!doc.nodes.length) return;

  const orphans = doc.nodes.filter(n => !doc.edges.some(e => e.a === n.id || e.b === n.id));
  if (orphans.length) add(`${orphans.length} unconnected node${orphans.length > 1 ? 's' : ''}`);

  if (window.NavPath) {
    const m = NavPath.loadMap(exportDoc());
    const groups = m.components();
    // Direction matters: an undirected "connected" graph can still have places
    // you walk into and never out of, so ask the directed question too.
    const reach = m.unreachablePlaces({ limit: 4 });
    if (groups.length > 1) add(`${groups.length} separate path islands`);
    if (reach.total) {
      const eg = reach.pairs.map(p => `${p.from} → ${p.to}`).join(', ');
      add(`${reach.total} one-way dead end${reach.total > 1 ? 's' : ''}: ${eg}` +
          (reach.total > reach.pairs.length ? ' …' : ''));
    } else if (groups.length === 1 && !orphans.length && doc.nodes.length > 1) {
      add('graph fully connected, both ways', true);
    }

    // A walker only follows the links you drew. If a link crosses a blocked
    // area, characters WILL walk through it — so it has to be caught here.
    const bad = m.blockedEdges();
    if (bad.length) add(`${bad.length} link${bad.length > 1 ? 's' : ''} cross a blocked area`);
  }

  const stranded = doc.locations.filter(b => b.node && !nodeById(b.node));
  if (stranded.length) add(`${stranded.length} location(s) pinned to a missing node`);

  // Duplicate destination ids resolve to whichever comes first, so a link
  // would land somewhere arbitrary.
  const seen = new Map();
  for (const n of doc.nodes) if (n.dest) seen.set(n.dest, (seen.get(n.dest) || 0) + 1);
  for (const b of doc.locations) if (b.dest) seen.set(b.dest, (seen.get(b.dest) || 0) + 1);
  const dupes = [...seen.entries()].filter(([, c]) => c > 1);
  if (dupes.length) add(`duplicate destination id: ${dupes.map(d => d[0]).join(', ')}`);

  const travel = doc.locations.filter(b => b.interact && b.interact.type === 'travel');
  const noTarget = travel.filter(b => !b.interact.map);
  if (noTarget.length) add(`${noTarget.length} travel link(s) with no target map`);
  if (doc.id && travel.some(b => b.interact.map === doc.id)) add('a travel link points at this same map');

  const stuck = doc.characters.filter(c => {
    if (!c.ai || c.ai.behavior !== 'patrol') return false;
    const stops = c.ai.routeMode === 'global' ? doc.globalRoute : c.route;
    return !(stops && stops.length);
  });
  if (stuck.length) add(`${stuck.length} character(s) set to walk a route with no stops`);
}

/* =============================================================== hint ===== */

const HINTS = {
  paths: '<b>Click</b> drops a node and chains it to the last one · <b>click a node</b> to link · ' +
         '<b>drag</b> to move · <b>Alt/right-click</b> deletes · <b>Esc</b> breaks the chain · ' +
         '<b>Shift+click</b> drops an unlinked node. New links land on the active layer above.',
  areas: 'Pick <b>+ Walkable</b> or <b>+ Blocked</b>, then click each corner. ' +
         '<b>Enter</b> or clicking the first dot closes it · <b>Backspace</b> undoes a corner · <b>Esc</b> cancels. ' +
         'Drag a vertex to adjust · <b>Alt-click</b> a vertex removes it.',
  locations: '<b>+ Hotspot</b> traces a clickable polygon — the precise region a player can click, ' +
             'stored in percent coordinates and independent of the background image. ' +
             '<b>Click</b> alone drops a plain anchor point instead. ' +
             'The dashed tether shows the path node characters walk to.',
  characters: '<b>Click</b> to place a character, then set its behaviour on the right. ' +
              'It can walk its own stops or the shared route, and be limited to certain path layers.',
  test: 'Click to set <b>start</b>, click again for <b>end</b> — snaps to locations and characters. ' +
        'Runs the real navpath.js A* over your data. <b>S</b> toggles smoothing · <b>Esc</b> clears.'
};
function refreshHint() {
  let h = HINTS[mode];
  if (routeEdit) {
    h = '<b>Picking stops.</b> Click path nodes or locations in the order they should be visited. ' +
        'Click <b>Done picking</b> or press <b>Esc</b> when finished.';
  } else if (codeView) {
    h = '<b>Code view.</b> Click anything on the map to read the exact JSON it exports as — ' +
        'an area, a link, a location, a character. With nothing selected you get the whole map. ' +
        'Press <b>J</b> to go back to editing.';
  } else if (selectTool) {
    h = '<b>Select tool.</b> Left click selects and drags what is already there — nothing new is created. ' +
        'Press <b>V</b> or the Select button to go back to placing. ' + h;
  } else if (mode === 'test' && test.result) {
    const r = test.result;
    h = r.ok
      ? `<b>Path found</b> · ${r.points.length} points · ${r.nodes.length} graph nodes · length ` +
        `${r.length.toFixed(1)} · cost ${r.cost.toFixed(1)} · smoothing <b>${test.smooth ? 'on' : 'off'}</b> (press S)` +
        (r.startWalkable && r.endWalkable ? '' : ' · ⚠ an endpoint is off walkable ground')
      : '<b>No path.</b> Those two points are not connected through the graph. ' + HINTS.test;
  }
  $('hint').innerHTML = h;
}

/* =============================================================== modes === */

function setMode(m, keepDraft) {
  mode = m;
  if (!keepDraft) draft = null;
  if (m !== 'paths') activeNode = null;
  [['mPaths', 'paths'], ['mAreas', 'areas'], ['mLocs', 'locations'],
   ['mChars', 'characters'], ['mTest', 'test']].forEach(([id, k]) => $(id).classList.toggle('on', m === k));
  cv.style.cursor = m === 'test' ? 'pointer' : selectTool ? 'default' : 'crosshair';
  refreshToolbar(); refreshHint(); refreshInspector(true); draw();
}
function startArea(kind) {
  if (mode !== 'areas') setMode('areas');
  draft = { kind, points: [] };
  sel = null;
  refreshAll();
}
/** Average of a polygon's corners — good enough to sit an anchor inside it. */
function centroid(points) {
  let x = 0, y = 0;
  for (const p of points) { x += p[0]; y += p[1]; }
  return { x: round1(x / points.length), y: round1(y / points.length) };
}

function commitDraft() {
  if (!draft) return;
  if (draft.points.length < 3) { toast('Needs at least 3 corners'); return; }
  pushHistory();
  if (draft.kind === 'footprint') {
    const c = centroid(draft.points);
    let owner = draft.owner;
    if (!owner) {
      owner = addLoc(c);
      // A hotspot drawn from scratch is meant to be clicked, so give it an
      // interaction rather than leaving it inert.
      owner.interact = { type: 'dialog' };
    }
    // A redraw from the inspector keeps the anchor the author placed.
    owner.footprint = draft.points;
    sel = { type: 'location', ref: owner };
  } else {
    doc.areas.push({ id: uid('a', doc.areas), kind: draft.kind, points: draft.points });
  }
  draft = null;
  pushHistory(); refreshAll();
}

/* ============================================================== input ==== */

const evPos = ev => {
  const r = cv.getBoundingClientRect();
  return { x: ev.clientX - r.left, y: ev.clientY - r.top };
};
function select(type, ref) { sel = { type, ref }; }

cv.addEventListener('pointerdown', ev => {
  // Capture is a convenience, not a precondition — if it throws, everything
  // below it must still run rather than the click being swallowed whole.
  try { cv.setPointerCapture(ev.pointerId); } catch (e) {}
  const s = evPos(ev);
  const p = applySnap(toPct(s.x, s.y));

  if (ev.button === 1 || keys.has('Space')) {
    dragging = { kind: 'pan', sx: s.x, sy: s.y, vx: view.x, vy: view.y };
    viewTouched = true; cv.style.cursor = 'grabbing';
    return;
  }
  const del = ev.button === 2 || ev.altKey;

  /* ---- test ---- */
  if (mode === 'test') {
    if (ev.button !== 0) return;
    const b = locAt(s.x, s.y), c = charAt(s.x, s.y);
    const pt = b ? { x: b.x, y: b.y } : c ? { x: c.x, y: c.y } : p;
    if (!test.a || test.b) { test.a = pt; test.b = null; test.result = null; }
    else { test.b = pt; runTest(); }
    draw(); refreshHint();
    return;
  }

  /* ---- picking route stops wins over everything else ---- */
  if (routeEdit && ev.button === 0 && !del) {
    const n = nodeAt(s.x, s.y), b = locAt(s.x, s.y);
    const id = n ? (n.dest || n.id) : b ? (b.dest || b.id) : null;
    if (id) {
      pushHistory();
      routeEdit.set((routeEdit.get() || []).concat(id));
      refreshAll();
      return;
    }
  }

  /* ---- paths ---- */
  if (mode === 'paths') {
    const n = nodeAt(s.x, s.y);
    if (del) {
      if (n) { pushHistory(); deleteNode(n.id); pushHistory(); refreshAll(); return; }
      const e = edgeAt(s.x, s.y);
      if (e) { pushHistory(); deleteEdge(e); pushHistory(); refreshAll(); }
      return;
    }
    if (ev.button !== 0) return;

    if (n) {
      select('node', n);
      if (chainOn && !selectTool && activeNode && activeNode !== n.id) {
        pushHistory();
        if (!addEdge(activeNode, n.id)) toast('Already linked');
        pushHistory();
      }
      activeNode = selectTool ? null : n.id;
      dragging = { kind: 'point', ref: n, moved: false };
      refreshAll();
      return;
    }
    const e = edgeAt(s.x, s.y);
    if (e) { select('edge', e); refreshAll(); return; }
    if (selectTool) { sel = null; activeNode = null; refreshAll(); return; }

    pushHistory();
    const fresh = addNode(p);
    if (chainOn && activeNode && !ev.shiftKey) addEdge(activeNode, fresh.id);
    activeNode = ev.shiftKey ? null : fresh.id;
    select('node', fresh);
    pushHistory();
    dragging = { kind: 'point', ref: fresh, moved: false };
    refreshAll();
    return;
  }

  /* ---- an open polygon draft takes clicks in any mode ---- */
  if (draft) {
    if (ev.button !== 0) return;
    if (draft.points.length >= 3) {
      const f = toScreen(draft.points[0][0], draft.points[0][1]);
      if (Math.hypot(f.x - s.x, f.y - s.y) < 12) { commitDraft(); return; }
    }
    draft.points.push([round1(p.x), round1(p.y)]);
    draw();
    return;
  }

  /* ---- areas ---- */
  if (mode === 'areas') {
    const v = vertexAt(s.x, s.y);
    if (v && del) {
      if (v.points.length <= 3) { toast('Needs at least 3 corners'); return; }
      pushHistory(); v.points.splice(v.index, 1); pushHistory(); refreshAll();
      return;
    }
    if (v && ev.button === 0) {
      select(v.owner.kind === undefined ? 'location' : 'area', v.owner);
      dragging = { kind: 'vertex', points: v.points, index: v.index, moved: false };
      refreshAll();
      return;
    }
    const hit = areaAt(p.x, p.y);
    if (hit && del) { pushHistory(); deleteArea(hit); pushHistory(); refreshAll(); return; }
    sel = hit ? { type: 'area', ref: hit } : null;
    refreshAll();
    return;
  }

  /* ---- locations ---- */
  if (mode === 'locations') {
    const b = locAt(s.x, s.y);
    if (b && del) { pushHistory(); deleteLoc(b); pushHistory(); refreshAll(); return; }
    if (ev.button !== 0) return;
    if (b) {
      select('location', b);
      dragging = { kind: 'point', ref: b, moved: false };
      refreshAll();
      return;
    }
    const v = vertexAt(s.x, s.y);
    if (v && v.owner && v.owner.footprint) {
      select('location', v.owner);
      dragging = { kind: 'vertex', points: v.points, index: v.index, moved: false };
      refreshAll();
      return;
    }
    // Clicking inside a footprint selects that location — a city block is a
    // much bigger click target than its 15px anchor.
    const inside = doc.locations.find(x => x.footprint && pointInPoly(p.x, p.y, x.footprint));
    if (inside) { select('location', inside); refreshAll(); return; }
    if (selectTool) { sel = null; refreshAll(); return; }

    pushHistory();
    const fresh = addLoc(p);
    select('location', fresh);
    pushHistory();
    dragging = { kind: 'point', ref: fresh, moved: false };
    refreshAll();
    return;
  }

  /* ---- characters ---- */
  if (mode === 'characters') {
    const c = charAt(s.x, s.y);
    if (c && del) { pushHistory(); deleteChar(c); pushHistory(); refreshAll(); return; }
    if (ev.button !== 0) return;
    if (c) {
      select('character', c);
      dragging = { kind: 'point', ref: c, moved: false };
      refreshAll();
      return;
    }
    if (selectTool) { sel = null; refreshAll(); return; }
    pushHistory();
    const fresh = addCharacter(p);
    select('character', fresh);
    pushHistory();
    dragging = { kind: 'point', ref: fresh, moved: false };
    refreshAll();
  }
});

cv.addEventListener('pointermove', ev => {
  const s = evPos(ev);
  mouse.x = s.x; mouse.y = s.y; mouse.inside = true;
  const p = toPct(s.x, s.y);
  $('coord').textContent = `${p.x.toFixed(1)}, ${p.y.toFixed(1)}`;

  if (dragging) {
    if (dragging.kind === 'pan') {
      view.x = dragging.vx + (s.x - dragging.sx);
      view.y = dragging.vy + (s.y - dragging.sy);
      clampView();          // a map that fits on screen stays centred
      draw(); return;
    }
    const q = applySnap(p);
    if (dragging.kind === 'point') { dragging.ref.x = q.x; dragging.ref.y = q.y; }
    else if (dragging.kind === 'vertex') dragging.points[dragging.index] = [q.x, q.y];
    dragging.moved = true;
    draw(); return;
  }

  const over = mode === 'paths' ? nodeAt(s.x, s.y)
             : mode === 'areas' ? vertexAt(s.x, s.y)
             : mode === 'locations' ? locAt(s.x, s.y)
             : mode === 'characters' ? charAt(s.x, s.y) : null;
  if (mode !== 'test') cv.style.cursor = over ? 'move' : selectTool ? 'default' : 'crosshair';
  if (draft || (mode === 'paths' && chainOn && !selectTool && activeNode)) draw();
});

cv.addEventListener('pointerup', ev => {
  if (dragging) {
    if (dragging.moved) { pushHistory(); refreshChips(); refreshInspector(true); refreshWarnings(); }
    dragging = null;
    cv.style.cursor = mode === 'test' ? 'pointer' : selectTool ? 'default' : 'crosshair';
    draw();
  }
  try { cv.releasePointerCapture(ev.pointerId); } catch (e) {}
});
cv.addEventListener('pointerleave', () => { mouse.inside = false; $('coord').textContent = '–'; draw(); });
cv.addEventListener('contextmenu', ev => ev.preventDefault());
cv.addEventListener('dblclick', () => { if (draft) commitDraft(); });

cv.addEventListener('wheel', ev => {
  ev.preventDefault();
  viewTouched = true;
  // Anchor on the middle of the viewport, not the cursor, so the map scales in
  // place and stays centred instead of creeping toward wherever the pointer is.
  const cx = cv.clientWidth / 2, cy = cv.clientHeight / 2;
  const before = toPct(cx, cy);
  // Never let it shrink much past "whole map visible" — a map zoomed out to a
  // speck is only ever a mistake.
  const floor = Math.max((fitScale() || 0.05) * 0.4, 0.02);
  view.s = Math.max(floor, Math.min(40, view.s * Math.exp(-ev.deltaY * 0.0015)));
  const after = toPct(cx, cy);
  view.x += ((after.x - before.x) / 100) * imgW() * view.s;
  view.y += ((after.y - before.y) / 100) * imgH() * view.s;
  clampView();
  draw();
}, { passive: false });

const keys = new Set();
window.addEventListener('keydown', ev => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)) return;
  keys.add(ev.code);
  const k = ev.key.toLowerCase();

  if ((ev.ctrlKey || ev.metaKey) && k === 'z') { ev.preventDefault(); ev.shiftKey ? redo() : undo(); return; }
  if ((ev.ctrlKey || ev.metaKey) && k === 'y') { ev.preventDefault(); redo(); return; }
  if ((ev.ctrlKey || ev.metaKey) && k === 's') { ev.preventDefault(); saveJson(); return; }

  if (ev.code === 'Escape') {
    if (draft) draft = null;
    else if (routeEdit) routeEdit = null;
    else if (mode === 'test') { test.a = test.b = null; test.result = null; }
    else { activeNode = null; sel = null; }
    refreshAll(); return;
  }
  if (ev.code === 'Enter' && draft) { commitDraft(); return; }
  if (ev.code === 'Backspace' && draft) { draft.points.pop(); draw(); return; }

  if (ev.code === 'Delete' || (ev.code === 'Backspace' && !draft)) {
    if (!sel) return;
    pushHistory();
    if (sel.type === 'node') deleteNode(sel.ref.id);
    else if (sel.type === 'edge') deleteEdge(sel.ref);
    else if (sel.type === 'area') deleteArea(sel.ref);
    else if (sel.type === 'location') deleteLoc(sel.ref);
    else if (sel.type === 'character') deleteChar(sel.ref);
    else if (sel.type === 'layer') deleteLayer(sel.ref);
    pushHistory(); refreshAll();
    return;
  }

  if (sel && sel.type === 'edge' && (k === '1' || k === '2' || k === '3')) {
    pushHistory();
    const v = Number(k);
    if (v === 1) delete sel.ref.cost; else sel.ref.cost = v;
    pushHistory(); refreshAll(); toast(v === 1 ? 'Cost reset' : 'Cost ×' + v);
    return;
  }
  if (k === 'o' && sel && sel.type === 'edge') {
    pushHistory();
    if (sel.ref.oneWay) delete sel.ref.oneWay; else sel.ref.oneWay = true;
    pushHistory(); refreshAll(); toast(sel.ref.oneWay ? 'One-way →' : 'Two-way');
    return;
  }
  if (k === 'v') { toggleSelectTool(); return; }
  if (k === 'j') { toggleCodeView(); return; }
  if (k === 's' && mode === 'test') { test.smooth = !test.smooth; runTest(); draw(); refreshHint(); return; }
  if (k === 'f') { viewTouched = false; fitView(); draw(); return; }
  if (k === 'p') setMode('paths');
  else if (k === 'a') setMode('areas');
  else if (k === 'l') setMode('locations');
  else if (k === 'c') setMode('characters');
  else if (k === 't') setMode('test');
});
window.addEventListener('keyup', ev => keys.delete(ev.code));

function toggleCodeView() {
  codeView = !codeView;
  // Reading code is a look-don't-touch mode: clicks should select, not create.
  if (codeView) selectTool = true;
  refreshToolbar(); refreshHint(); refreshInspector(true);
  cv.style.cursor = mode === 'test' ? 'pointer' : selectTool ? 'default' : 'crosshair';
  draw();
}

function toggleSelectTool() {
  selectTool = !selectTool;
  if (selectTool) activeNode = null;
  cv.style.cursor = mode === 'test' ? 'pointer' : selectTool ? 'default' : 'crosshair';
  refreshToolbar(); refreshHint(); draw();
}

/* =============================================================== test ==== */

function runTest() {
  if (!window.NavPath) { toast('navpath.js not loaded'); return; }
  if (!test.a || !test.b) return;
  test.result = NavPath.loadMap(exportDoc()).findPath(test.a, test.b, { smooth: test.smooth });
  refreshHint();
}

/* ============================================================ import/IO == */

function exportDoc() {
  const output = {
    version: FORMAT_VERSION,
    id: doc.id || '',
    image: doc.image.kind === 'html'
      ? { name: doc.image.name, w: doc.image.w, h: doc.image.h, kind: 'html' }
      : { name: doc.image.name, w: doc.image.w, h: doc.image.h },
    layers: doc.layers.map(l => {
      const o = { id: l.id, name: l.name, color: l.color, visible: l.visible !== false };
      if (l.locked) o.locked = true;
      if (Number.isFinite(l.zMin)) o.zMin = l.zMin;
      if (Number.isFinite(l.zMax)) o.zMax = l.zMax;
      return o;
    }),
    nodes: doc.nodes.map(n => {
      const o = { id: n.id, x: round1(n.x), y: round1(n.y) };
      if (Number.isFinite(n.z)) o.z = n.z;
      if (n.layer) o.layer = n.layer;
      if (n.dest) o.dest = n.dest;
      if (n.tags && n.tags.length) o.tags = n.tags.slice();
      return o;
    }),
    edges: doc.edges.map(e => {
      const o = { a: e.a, b: e.b };
      if (e.id) o.id = e.id;
      if (e.layer) o.layer = e.layer;
      if (e.cost && e.cost !== 1) o.cost = e.cost;
      if (e.oneWay) o.oneWay = true;
      return o;
    }),
    areas: doc.areas.map(a => {
      const o = { id: a.id, kind: a.kind, points: a.points.map(p => Number.isFinite(p[2]) ? [round1(p[0]), round1(p[1]), p[2]] : [round1(p[0]), round1(p[1])]) };
      if (a.name) o.name = a.name;
      if (a.layer) o.layer = a.layer;
      if (Number.isFinite(a.zMin)) o.zMin = a.zMin;
      if (Number.isFinite(a.zMax)) o.zMax = a.zMax;
      return o;
    }),
    locations: doc.locations.map(b => {
      const o = { id: b.id, name: b.name || b.id, x: round1(b.x), y: round1(b.y) };
      if (b.dest) o.dest = b.dest;
      if (b.kind) o.kind = b.kind;
      if (b.node) o.node = b.node;
      if (b.footprint) o.footprint = b.footprint.map(p => [round1(p[0]), round1(p[1])]);
      if (b.interact && b.interact.type && b.interact.type !== 'none') o.interact = clone(b.interact);
      return o;
    }),
    characters: doc.characters.map(c => {
      const o = { id: c.id, name: c.name || c.id, x: round1(c.x), y: round1(c.y) };
      if (c.facing) o.facing = c.facing;
      if (c.home) o.home = c.home;
      if (c.route && c.route.length) o.route = c.route.slice();
      if (c.ai && c.ai.behavior && c.ai.behavior !== 'idle') o.ai = clone(c.ai);
      if (c.sprite && c.sprite.frames && c.sprite.frames.length) o.sprite = clone(c.sprite);
      return o;
    }),
    globalRoute: (doc.globalRoute || []).slice()
  };
  // LoopLab owns timing, elevation, meetings, animation cues, events, and
  // deterministic receipts that this percentage-path editor does not expose.
  // Carry the extension byte-for-byte through a visible edit instead of
  // silently flattening or discarding those authored contracts.
  if (doc.looplab && typeof doc.looplab === 'object') output.looplab = clone(doc.looplab);
  return output;
}

function saveJson() {
  const blob = new Blob([JSON.stringify(exportDoc(), null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (doc.id || doc.image.name || 'map').replace(/\.[^.]+$/, '') + '.path.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function toTS() {
  const d = exportDoc();
  const name = (d.id || d.image.name || 'map').replace(/\.[^.]+$/, '').replace(/[^a-z0-9]+/gi, ' ').trim()
    .split(/\s+/).map((w, i) => (i ? w[0].toUpperCase() + w.slice(1) : w.toLowerCase())).join('') || 'map';
  return `// Generated by the path editor. Every coordinate is a percentage of the
// map image (x: 0-100 of width, y: 0-100 of height), so the data survives any
// render size. Feed it to navpath.js: NavPath.loadMap(${name}Map).
export interface PathLayer { id: string; name: string; color: string; visible: boolean }
export interface PathNode {
  id: string; x: number; y: number;
  /** Stable, author-chosen name for this spot — what routes and links point at. */
  dest?: string;
  tags?: string[];
}
export interface PathEdge { a: string; b: string; layer?: string; cost?: number; oneWay?: boolean }
export interface PathArea { id: string; kind: 'walkable' | 'blocked'; points: [number, number][] }
export interface InteractOption { text: string; action?: string }
export interface Interaction {
  type: 'dialog' | 'shop' | 'enter' | 'travel' | 'custom';
  /** Prompt shown to the player. */
  label?: string;
  /** How close the player must be, in percent-of-height units. Default 6. */
  radius?: number;
  lines?: string[];
  options?: InteractOption[];
  /** 'enter' — a scene or level inside this map. */
  scene?: string;
  /** 'travel' — the id of another map. */
  map?: string;
  /** 'travel' — destination id to arrive at over there; omitted means its spawn. */
  node?: string;
  data?: Record<string, unknown>;
}
/** Any named place: a shop, a plaza, a park, a gate. */
export interface MapLocation {
  id: string; name: string; dest?: string; kind?: string; x: number; y: number;
  /** Pinned path node characters walk to; omitted means "snap to nearest". */
  node?: string;
  /**
   * Clickable polygon hotspot, in percent coordinates — independent of the
   * background image, so it holds at any render size. When present it IS the
   * hit region; proximity only applies if interact.radius is set explicitly.
   */
  footprint?: [number, number][];
  interact?: Interaction;
}
export interface CharacterAI {
  behavior: 'patrol' | 'wander' | 'visit';
  /** Percent-of-height units per second. */
  speed?: number;
  /** Seconds spent waiting at each stop. */
  pause?: number;
  loop?: boolean;
  /** patrol — 'global' walks the map's shared route instead of its own stops. */
  routeMode?: 'custom' | 'global';
  /** visit — location ids. Empty means any location. */
  targets?: string[];
  /** Path layers this character may use. Empty means the whole network. */
  layers?: string[];
}
/**
 * Animation frames. The map records where the images live and what they are
 * called, sorted; loading them is your game's job, so the map file stays small.
 *   src = \`\${assetBase}/\${sprite.folder}/\${sprite.frames[i]}\`
 */
export interface CharacterSprite {
  /** Folder the frames were picked from, relative to your asset root. */
  folder: string;
  /** File names in play order (natural-sorted by filename). */
  frames: string[];
  fps: number;
  scale: number;
  /** Where the character's x/y sits on the image. */
  anchor: 'feet' | 'center';
}
export interface Character {
  id: string; name: string; x: number; y: number;
  facing?: number; home?: string; route?: string[];
  ai?: CharacterAI;
  sprite?: CharacterSprite;
}
export interface PathMap {
  version: number;
  /** This map's id, e.g. "map-01-prospect-yards". */
  id: string;
  image: { name: string; w: number; h: number };
  layers: PathLayer[];
  nodes: PathNode[];
  edges: PathEdge[];
  areas: PathArea[];
  locations: MapLocation[];
  characters: Character[];
  /** Shared stop list characters can be told to walk instead of their own. */
  globalRoute: string[];
}

export const ${name}Map: PathMap = ${JSON.stringify(d, null, 2)};
`;
}

/**
 * Runtime + this map as one inline block, for a single-file HTML game that
 * cannot load an external script.
 *
 * The runtime source is fetched from navpath.js next to this page. That works
 * when the editor is served over http; over file:// the browser blocks the
 * read, so the map data is copied on its own with a note — the build-inline.js
 * script does the same job from disk and always works.
 */
async function copyForGame() {
  const data = JSON.stringify(exportDoc());
  const varName = 'GAME_MAP';
  let runtime = null;
  try {
    const res = await fetch('navpath.js');
    if (res.ok) runtime = await res.text();
  } catch (e) { /* file:// — fall through */ }

  let text;
  if (runtime) {
    text = '<script>\n' + runtime.trimEnd() + '\n' +
           `var ${varName} = NavPath.loadMap(${data});\n` +
           `if (typeof window !== 'undefined') window.${varName} = ${varName};\n` +
           '<\/script>\n';
    toast('Runtime + map copied — paste into your game');
  } else {
    text = '<!-- Paste the contents of navpath.js above this block. -->\n' +
           '<script>\n' +
           `var ${varName} = NavPath.loadMap(${data});\n` +
           '<\/script>\n';
    toast('Map copied — paste navpath.js above it (or use build-inline.js)');
  }

  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
}

async function copyTs() {
  const text = toTS();
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
  toast('TypeScript copied');
}

function loadDoc(data, quiet) {
  if (!data || typeof data !== 'object') { toast('Not a path file'); return false; }
  // The outgoing characters take their frame object URLs with them.
  for (const c of doc.characters) releaseFrames(c.id);
  // `buildings` was the old key for what are now locations.
  const locs = data.locations || data.buildings || [];
  doc = {
    version: FORMAT_VERSION,
    id: data.id ? String(data.id) : '',
    image: Object.assign({ name: '', w: 1600, h: 1000 }, data.image || {}),
    layers: (data.layers || []).map((l, i) => ({
      id: String(l.id || 'l' + i),
      name: String(l.name || 'Layer ' + (i + 1)),
      color: String(l.color || LAYER_COLORS[i % LAYER_COLORS.length]),
      visible: l.visible !== false,
      locked: l.locked === true,
      ...(Number.isFinite(+l.zMin) ? { zMin: +l.zMin } : {}),
      ...(Number.isFinite(+l.zMax) ? { zMax: +l.zMax } : {})
    })),
    activeLayer: '',
    nodes: (data.nodes || []).map(n => {
      const o = { id: String(n.id), x: +n.x, y: +n.y };
      if (Number.isFinite(+n.z)) o.z = +n.z;
      if (n.layer) o.layer = String(n.layer);
      if (n.dest) o.dest = String(n.dest);
      if (Array.isArray(n.tags) && n.tags.length) o.tags = n.tags.map(String);
      return o;
    }),
    edges: (data.edges || []).map(e => {
      const o = { a: String(e.a), b: String(e.b) };
      if (e.id) o.id = String(e.id);
      if (e.layer) o.layer = String(e.layer);
      if (e.cost) o.cost = +e.cost;
      if (e.oneWay) o.oneWay = true;
      return o;
    }),
    areas: (data.areas || []).map((a, i) => ({
      id: String(a.id || 'a' + i),
      kind: a.kind === 'blocked' ? 'blocked' : 'walkable',
      points: (a.points || []).map(p => Number.isFinite(+p[2]) ? [+p[0], +p[1], +p[2]] : [+p[0], +p[1]]),
      ...(a.name ? { name: String(a.name) } : {}),
      ...(a.layer ? { layer: String(a.layer) } : {}),
      ...(Number.isFinite(+a.zMin) ? { zMin: +a.zMin } : {}),
      ...(Number.isFinite(+a.zMax) ? { zMax: +a.zMax } : {})
    })),
    locations: locs.map((b, i) => {
      const o = { id: String(b.id || 'b' + i), name: String(b.name || b.id || 'Location'), x: +b.x, y: +b.y };
      if (b.dest) o.dest = String(b.dest);
      if (b.kind) o.kind = String(b.kind);
      if (b.node) o.node = String(b.node);
      if (Array.isArray(b.footprint) && b.footprint.length >= 3) o.footprint = b.footprint.map(p => [+p[0], +p[1]]);
      if (b.interact && typeof b.interact === 'object' && b.interact.type) o.interact = clone(b.interact);
      return o;
    }),
    characters: (data.characters || []).map((c, i) => {
      const o = { id: String(c.id || 'c' + i), name: String(c.name || c.id || 'Character'), x: +c.x, y: +c.y };
      o.facing = +c.facing || 0;
      if (c.home) o.home = String(c.home);
      if (Array.isArray(c.route) && c.route.length) o.route = c.route.map(String);
      if (c.ai && typeof c.ai === 'object' && c.ai.behavior) o.ai = clone(c.ai);
      if (c.sprite && Array.isArray(c.sprite.frames) && c.sprite.frames.length) {
        o.sprite = {
          folder: String(c.sprite.folder || ''),
          frames: c.sprite.frames.map(String),
          fps: +c.sprite.fps || 8,
          scale: +c.sprite.scale || 1,
          anchor: c.sprite.anchor === 'center' ? 'center' : 'feet'
        };
      }
      return o;
    }),
    globalRoute: Array.isArray(data.globalRoute) ? data.globalRoute.map(String) : [],
    looplab: data.looplab && typeof data.looplab === 'object' && !Array.isArray(data.looplab) ? clone(data.looplab) : null
  };
  ensureLayers();

  // Prune references that point at things this file does not contain.
  const nodeIds = new Set(doc.nodes.map(n => n.id));
  const before = doc.edges.length;
  doc.edges = doc.edges.filter(e => nodeIds.has(e.a) && nodeIds.has(e.b));
  if (doc.edges.length !== before) toast(`Dropped ${before - doc.edges.length} dangling link(s)`);
  const layerIds = new Set(doc.layers.map(l => l.id));
  for (const e of doc.edges) if (!e.layer || !layerIds.has(e.layer)) e.layer = doc.layers[0].id;
  for (const b of doc.locations) if (b.node && !nodeIds.has(b.node)) delete b.node;
  const locIds = new Set(doc.locations.map(b => b.id));
  const stopIds = new Set([...nodeIds, ...locIds,
    ...doc.nodes.filter(n => n.dest).map(n => n.dest),
    ...doc.locations.filter(b => b.dest).map(b => b.dest)]);
  for (const c of doc.characters) {
    if (c.home && !locIds.has(c.home)) delete c.home;
    if (c.route) { c.route = c.route.filter(r => stopIds.has(r)); if (!c.route.length) delete c.route; }
    if (c.ai && c.ai.layers) {
      c.ai.layers = c.ai.layers.filter(l => layerIds.has(l));
      if (!c.ai.layers.length) delete c.ai.layers;
    }
    if (c.ai && c.ai.targets) {
      c.ai.targets = c.ai.targets.filter(t => locIds.has(t));
      if (!c.ai.targets.length) delete c.ai.targets;
    }
  }
  doc.globalRoute = doc.globalRoute.filter(r => stopIds.has(r));

  history.length = 0; histAt = -1;
  pushHistory();
  activeNode = null; sel = null; draft = null; routeEdit = null;
  test = { a: null, b: null, result: null, smooth: test.smooth };
  viewTouched = false; fitView();
  refreshAll();
  if (!quiet) {
    const richRouteLabel = doc.looplab && doc.looplab.authoredRoute ? ' · rich timed route preserved' : '';
    toast(`Loaded ${doc.nodes.length} nodes, ${doc.areas.length} areas, ` +
          `${doc.locations.length} locations, ${doc.characters.length} characters${richRouteLabel}`);
  }
  return true;
}

function setImage(file) {
  const url = URL.createObjectURL(file);
  const im = new Image();
  im.onload = () => {
    clearHtmlBackdrop();
    img = im;
    doc.image = { name: file.name, w: im.naturalWidth, h: im.naturalHeight };
    updateDrop();
    viewTouched = false; fitView(); draw();
    toast(`${im.naturalWidth}×${im.naturalHeight}`);
  };
  im.onerror = () => toast('Could not read that image');
  im.src = url;
}

/* ------------------------------------------------------- HTML backdrop -- */

let htmlUrl = null;

/**
 * Rebuild the backdrop iframe with a given sandbox.
 *
 * The sandbox attribute only takes effect on navigation, and setting src to
 * the same blob URL will not reliably re-navigate — so the element is replaced
 * outright. It must stay before the canvas in the DOM to sit behind it.
 */
function makeBackdropFrame(sandbox, measuring) {
  const old = $('htmlMap');
  if (old) old.remove();
  const f = document.createElement('iframe');
  f.id = 'htmlMap';
  f.title = 'map backdrop';
  f.setAttribute('sandbox', sandbox);
  // A measuring frame must keep the size it was given; syncBackdrop skips it.
  if (measuring) f.dataset.measuring = '1';
  stage.insertBefore(f, stage.firstChild);
  return f;
}

function clearHtmlBackdrop() {
  const f = $('htmlMap');
  if (f) { f.classList.remove('on'); f.removeAttribute('src'); f.onload = null; }
  if (htmlUrl) { URL.revokeObjectURL(htmlUrl); htmlUrl = null; }
}

/**
 * Load an HTML map and render it live behind the canvas at 1:1, so paths can
 * be traced over the real thing rather than a screenshot of it.
 *
 * Measured first, then rendered. The measuring pass needs to read the page's
 * layout, so it runs same-origin; the render pass does not, so it does not get
 * that and is isolated. Withholding it there is free.
 *
 * Measuring runs the map's own scripts, because plenty of maps build their
 * layout in JavaScript and report no size without them. An earlier version
 * measured with scripts disabled first and only re-ran them if that came up
 * empty — correct, but it logged a "Blocked script execution" console error on
 * every single load, which is a bad trade for a tool loading your own files.
 */
function setHtmlBackdrop(file, onReady) {
  clearHtmlBackdrop();
  img = null;
  htmlUrl = URL.createObjectURL(file);

  const usable = (w, h) => w > 50 && h > 50;

  function measureWith(sandbox, done) {
    const f = makeBackdropFrame(sandbox, true);
    /*
     * Two things this has to get right, both of which silently return a
     * plausible-looking wrong answer if missed:
     *
     *  - display:block. The #htmlMap rule hides the frame until it is ready,
     *    and a display:none iframe has NO layout, so every measurement is 0.
     *  - a tiny box. At the default 300x150 an empty document reports the
     *    FRAME's size as though it were content, which passes the "did we get
     *    a real number" test and stops the scripted fallback firing.
     *
     * Off-screen rather than hidden, since visibility:hidden also kills layout
     * for some content.
     */
    f.style.cssText = 'position:absolute;left:-99999px;top:0;border:0;' +
                      'display:block;width:10px;height:10px;';
    f.onload = () => {
      let w = 0, h = 0;
      try {
        const d = f.contentDocument;
        const de = d.documentElement, b = d.body;
        w = Math.max(de.scrollWidth, b ? b.scrollWidth : 0, de.offsetWidth);
        h = Math.max(de.scrollHeight, b ? b.scrollHeight : 0, de.offsetHeight);
      } catch (e) { /* unreadable — caller falls back */ }
      done(w, h);
    };
    f.src = htmlUrl;
  }

  function render(w, h) {
    if (!usable(w, h)) { w = doc.image.w || 1600; h = doc.image.h || 1000; }
    doc.image = { name: file.name, w, h, kind: 'html' };
    const live = makeBackdropFrame('allow-scripts');
    live.onload = () => {
      live.classList.add('on');
      updateDrop();
      viewTouched = false; fitView(); draw();
      if (onReady) onReady(w, h);
      else toast(`${file.name} — ${w}×${h}`);
    };
    live.src = htmlUrl;
  }

  measureWith('allow-scripts allow-same-origin', render);
}

/* ------------------------------------------------- round-trip with a game */

let gameFile = null;          // { handle, name, text }
let gameVar = 'GAME_MAP';
let gameWriteArmed = false;   // first in-place overwrite of a file asks twice

/**
 * Open a game's HTML: render it as the backdrop AND, if it already carries an
 * embedded map, load that map for editing. That is what makes this a
 * round-trip rather than a one-way export.
 */
async function openGame() {
  let file = null, handle = null;
  // The file-system picker hands back a writable handle, which is what lets
  // "Save to game" put the map back into the same file rather than downloading
  // a copy. It needs a secure context, so fall back where it is unavailable.
  if (window.showOpenFilePicker) {
    try {
      [handle] = await window.showOpenFilePicker({
        multiple: false,
        types: [{ description: 'HTML game', accept: { 'text/html': ['.html', '.htm'] } }]
      });
      file = await handle.getFile();
    } catch (e) {
      if (e && e.name === 'AbortError') return;      // user cancelled
      handle = null;
    }
  }
  if (!file) { $('fileGame').click(); return; }      // plain picker, no handle
  useGameFile(file, handle);
}

function useGameFile(file, handle) {
  const reader = new FileReader();
  reader.onload = () => {
    const text = String(reader.result);
    gameFile = { handle: handle || null, name: file.name, text };
    gameWriteArmed = false;
    const embedded = window.NavPath ? NavPath.extractMap(text) : null;

    setHtmlBackdrop(file, (w, h) => {
      if (embedded) {
        // The live measurement of the page beats whatever size was saved with
        // the map — the game's layout is the authority on its own size.
        loadDoc(embedded, true);
        doc.image = { name: file.name, w, h, kind: 'html' };
        pushHistory();
        viewTouched = false; fitView(); refreshAll();
        toast(`${file.name} — loaded its embedded map (${doc.nodes.length} nodes)`);
      } else {
        doc.image = { name: file.name, w, h, kind: 'html' };
        refreshAll();
        toast(`${file.name} — ${w}×${h}, no map embedded yet`);
      }
    });
  };
  reader.onerror = () => toast('Could not read that file');
  reader.readAsText(file);
}

/** Write the current map back into the loaded game's HTML. */
async function saveToGame() {
  if (!gameFile) { toast('Load a game first with Game…'); return; }
  if (!window.NavPath) { toast('navpath.js not loaded'); return; }

  const canWriteInPlace = !!(gameFile.handle && gameFile.handle.createWritable);
  // Overwriting the user's own game file is not something to do on a stray
  // click, so the first write per file asks twice. After that, iterating is
  // meant to be fast.
  if (canWriteInPlace && !gameWriteArmed) {
    gameWriteArmed = true;
    $('saveGame').textContent = `Overwrite ${gameFile.name}?`;
    $('saveGame').classList.add('danger');
    setTimeout(() => {
      if (gameWriteArmed) {
        gameWriteArmed = false;
        $('saveGame').textContent = 'Save to game';
        $('saveGame').classList.remove('danger');
      }
    }, 4000);
    return;
  }
  $('saveGame').textContent = 'Save to game';
  $('saveGame').classList.remove('danger');

  let runtime = null;
  try {
    const r = await fetch('navpath.js');
    if (r.ok) runtime = await r.text();
  } catch (e) { /* file:// blocks this; the data still goes in */ }

  // Re-read the file rather than trusting the copy taken at load time. An edit
  // made in a code editor while this map was open would otherwise be silently
  // reverted by writing our stale snapshot back over it.
  let base = gameFile.text;
  if (canWriteInPlace) {
    try {
      const fresh = await (await gameFile.handle.getFile()).text();
      if (fresh !== gameFile.text) {
        base = fresh;
        toast('Game file changed on disk — merging into the current version');
      }
    } catch (e) { /* unreadable now; fall back to what we have */ }
  }

  const out = NavPath.injectMap(base, exportDoc(), { runtime, varName: gameVar });

  if (canWriteInPlace) {
    try {
      const w = await gameFile.handle.createWritable();
      await w.write(out);
      await w.close();
      gameFile.text = out;
      toast(`Map written into ${gameFile.name}` + (runtime ? ' with the runtime' : ' (add navpath.js yourself)'));
      refreshAll();
      return;
    } catch (e) {
      toast('Could not write in place — downloading a copy instead');
    }
  }

  const blob = new Blob([out], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = gameFile.name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  gameFile.text = out;
  toast(`Downloaded ${gameFile.name} with the map embedded`);
  refreshAll();
}

/** Keep the backdrop locked to the canvas view. */
function syncBackdrop() {
  const f = $('htmlMap');
  if (!f) return;                       // rebuilt between load passes
  // Resizing a frame mid-measurement makes an empty document report the
  // frame's own box as if it were content, which is exactly the noise the
  // 10px measuring frame exists to avoid.
  if (f.dataset.measuring) return;
  if (doc.image.kind !== 'html' || !htmlUrl) { f.classList.remove('on'); return; }
  f.classList.toggle('on', showImg);
  f.style.width = imgW() + 'px';
  f.style.height = imgH() + 'px';
  f.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.s})`;
}
function readJsonFile(file) {
  const r = new FileReader();
  r.onload = () => { try { loadDoc(JSON.parse(r.result)); } catch (e) { toast('Invalid JSON'); } };
  r.readAsText(file);
}

/* ============================================================ drag & drop = */

const stage = $('stage');
['dragenter', 'dragover'].forEach(t => stage.addEventListener(t, ev => {
  ev.preventDefault(); $('drop').classList.remove('hide'); $('drop').classList.add('armed');
}));
['dragleave', 'drop'].forEach(t => stage.addEventListener(t, ev => {
  ev.preventDefault(); $('drop').classList.remove('armed'); updateDrop();
}));
stage.addEventListener('drop', ev => {
  const f = ev.dataTransfer.files[0];
  if (!f) return;
  if (/\.json$/i.test(f.name)) readJsonFile(f);
  else if (/\.html?$/i.test(f.name)) setHtmlBackdrop(f);
  else if (f.type.startsWith('image/')) setImage(f);
  else toast('Drop an image, an .html map, or a .json');
});

/* =============================================================== wiring == */

$('mPaths').onclick = () => setMode('paths');
$('mAreas').onclick = () => setMode('areas');
$('mLocs').onclick = () => setMode('locations');
$('mChars').onclick = () => setMode('characters');
$('mTest').onclick = () => setMode('test');
$('addWalk').onclick = () => startArea('walkable');
$('addBlock').onclick = () => startArea('blocked');
// Always starts a NEW location whose polygon is its clickable region. It must
// not adopt the current selection as owner — committing a hotspot selects the
// location it made, so the next click would silently redraw that one instead
// of adding another. Redrawing an existing hotspot is the inspector's job.
$('addHotspot').onclick = () => {
  if (mode !== 'locations') setMode('locations');
  sel = null;
  draft = { kind: 'footprint', points: [], owner: null, createOnClose: true };
  toast('Trace the clickable area — Enter to close');
  refreshAll();
};
$('selectTool').onclick = toggleSelectTool;
$('codeTool').onclick = toggleCodeView;
$('chain').onchange = e => { chainOn = e.target.checked; draw(); };
$('snap').onchange = e => { snapOn = e.target.checked; };
$('showImg').onchange = e => { showImg = e.target.checked; draw(); };
$('undo').onclick = undo;
$('redo').onclick = redo;
/* Reset arms on the first click and fires on the second. A native confirm()
   is suppressed outright by embedded and preview browsers — it returns false
   and the button silently does nothing, which reads as "reset is broken". */
let resetArmed = 0;
function disarmReset() {
  resetArmed = 0;
  $('reset').textContent = 'Reset';
  $('reset').classList.remove('danger');
}
$('reset').onclick = () => {
  if (!doc.nodes.length && !doc.areas.length && !doc.locations.length && !doc.characters.length) {
    toast('Nothing to clear');
    return;
  }
  const now = performance.now();
  if (!resetArmed || now - resetArmed > 4000) {
    resetArmed = now;
    $('reset').textContent = 'Clear everything?';
    $('reset').classList.add('danger');
    setTimeout(() => { if (resetArmed && performance.now() - resetArmed >= 4000) disarmReset(); }, 4100);
    return;
  }
  disarmReset();
  pushHistory();
  for (const c of doc.characters) releaseFrames(c.id);   // object URLs, not GC'd
  doc.nodes = []; doc.edges = []; doc.areas = []; doc.locations = []; doc.characters = [];
  doc.globalRoute = [];
  activeNode = null; sel = null; routeEdit = null;
  test = { a: null, b: null, result: null, smooth: test.smooth };
  pushHistory(); refreshAll();
  toast('Cleared — Ctrl+Z to undo');
};
$('loadGame').onclick = openGame;
$('saveGame').onclick = saveToGame;
$('fileGame').onchange = e => { if (e.target.files[0]) useGameFile(e.target.files[0], null); e.target.value = ''; };
$('loadImg').onclick = () => $('fileImg').click();
$('loadJson').onclick = () => $('fileJson').click();
$('fileImg').onchange = e => {
  const f = e.target.files[0];
  if (f) (/\.html?$/i.test(f.name) ? setHtmlBackdrop : setImage)(f);
  e.target.value = '';
};
$('fileJson').onchange = e => { if (e.target.files[0]) readJsonFile(e.target.files[0]); e.target.value = ''; };
$('fileFrames').onchange = e => {
  if (pendingFrameTarget && e.target.files.length) loadFrames(pendingFrameTarget, e.target.files);
  pendingFrameTarget = null;
  e.target.value = '';
  refreshAll();
};
$('copyTs').onclick = copyTs;
$('copyGame').onclick = copyForGame;
$('save').onclick = saveJson;

window.addEventListener('resize', resize);
// A flex child can get its real size after this script runs; observe it rather
// than trusting the first layout pass.
if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
window.addEventListener('beforeunload', ev => {
  if (doc.nodes.length || doc.areas.length || doc.locations.length || doc.characters.length) {
    ev.preventDefault(); ev.returnValue = '';
  }
});

/* =============================================================== boot ==== */

(function boot() {
  loadKnownIds();
  let restored = false;
  try {
    const raw = localStorage.getItem(AUTOSAVE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if ((data.nodes || []).length || (data.areas || []).length ||
          (data.locations || data.buildings || []).length || (data.characters || []).length) {
        loadDoc(data, true); restored = true;
      }
    }
  } catch (e) { /* a corrupt autosave must not brick the editor */ }

  if (!restored) { ensureLayers(); pushHistory(); }
  resize();
  setMode('paths');
  refreshAll();
  if (restored) toast('Restored your last map' + (doc.image.name ? ` — re-drop ${doc.image.name}` : ''));
})();
</script>
</body>

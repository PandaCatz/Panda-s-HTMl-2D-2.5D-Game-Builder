<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Path editor</title>
<style>
  :root{
    --bg:#0a0e1a; --panel:#111827; --panel2:#0d1424; --line:#1f2a44;
    --ink:#e8edf7; --dim:#8b9ac0; --accent:#8b5cf6;
    --node:#fbbf24; --walk:#22c55e; --block:#f43f5e;
    --loc:#38bdf8; --char:#f472b6; --test:#22d3ee;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:13px/1.4 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;overflow:hidden;user-select:none;
  }
  .bar{
    display:flex;align-items:center;gap:8px;padding:8px 12px;flex-wrap:wrap;
    background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto;
  }
  .brand{font-weight:600;letter-spacing:.2px;margin-right:6px;white-space:nowrap}
  .sep{width:1px;height:22px;background:var(--line);margin:0 2px}
  .spring{flex:1 1 auto}
  button,.btn{
    background:var(--panel2);color:var(--ink);border:1px solid var(--line);
    border-radius:7px;padding:6px 11px;font:inherit;cursor:pointer;white-space:nowrap;
  }
  button:hover,.btn:hover{background:#182338;border-color:#2c3a5c}
  button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  button.go{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.go:hover{background:#7c4ded}
  button:disabled{opacity:.35;cursor:default}
  button:disabled:hover{background:var(--panel2);border-color:var(--line)}
  button.walk{border-color:#1c5c37;color:#86efac}
  button.block{border-color:#6b1f34;color:#fda4af}
  button.small{padding:4px 8px;font-size:12px}
  button.danger{border-color:#6b1f34;color:#fda4af}
  label.chk{display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--dim)}
  label.chk input{accent-color:var(--accent);cursor:pointer}
  .coord{
    font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:12px;color:#f0a742;
    background:var(--panel2);border:1px solid var(--line);border-radius:7px;
    padding:6px 10px;min-width:104px;text-align:center;
  }
  /* ---- layer strip ---- */
  .layerbar{
    display:flex;align-items:center;gap:7px;padding:6px 12px;flex-wrap:wrap;
    background:var(--panel2);border-bottom:1px solid var(--line);flex:0 0 auto;
  }
  .layerbar .lbl{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.6px;margin-right:2px}
  .lyr{
    display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
    border-radius:7px;padding:3px 5px 3px 8px;font-size:12px;cursor:pointer;background:#0a0f1c;
  }
  .lyr:hover{border-color:#2c3a5c}
  .lyr.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .lyr.hidden{opacity:.45}
  .lyr .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .lyr .eye,.lyr .x{
    border:0;background:transparent;color:var(--ink);opacity:.55;cursor:pointer;
    padding:0 3px;font-size:12px;line-height:1;border-radius:4px;
  }
  .lyr .eye:hover,.lyr .x:hover{opacity:1;background:rgba(255,255,255,.12)}
  .lyr .n{color:var(--dim);font-size:11px}
  /* ---- stage ---- */
  .split{flex:1 1 auto;display:flex;min-height:0}
  .stage{flex:1 1 auto;position:relative;min-width:0;background:#060911;overflow:hidden}
  /* A live HTML map sits behind the canvas, transformed by the same view, so
     it lines up 1:1 with what you draw on top of it. */
  #htmlMap{
    position:absolute;left:0;top:0;border:0;transform-origin:0 0;
    pointer-events:none;background:#0d1424;display:none;
  }
  #htmlMap.on{display:block}
  canvas{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none;position:relative;z-index:1}
  .drop{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    pointer-events:none;flex-direction:column;gap:10px;color:var(--dim);text-align:center;padding:24px;
  }
  .drop b{color:var(--ink);font-size:15px;font-weight:600}
  .drop.hide{display:none}
  .drop.armed{background:rgba(139,92,246,.14);outline:2px dashed var(--accent);outline-offset:-14px}
  .hint{
    position:absolute;left:12px;bottom:12px;background:rgba(10,14,26,.92);border:1px solid var(--line);
    border-radius:8px;padding:7px 11px;color:var(--dim);font-size:12px;max-width:min(620px,72%);
    backdrop-filter:blur(6px);pointer-events:none;
  }
  .hint b{color:var(--ink)}
  .warn{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
  .warn span{background:rgba(244,63,94,.14);border:1px solid #6b1f34;color:#fda4af;border-radius:8px;padding:6px 10px;font-size:12px}
  .warn span.ok{background:rgba(34,197,94,.12);border-color:#1c5c37;color:#86efac}
  /* ---- inspector ---- */
  .insp{
    flex:0 0 262px;background:var(--panel);border-left:1px solid var(--line);
    overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;
  }
  .insp h2{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);margin:0;font-weight:600}
  .insp .none{color:var(--dim);font-size:12px;line-height:1.6}
  .fld{display:flex;flex-direction:column;gap:4px}
  .fld>label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
  .fld input[type=text],.fld input[type=number],.fld select,.fld textarea{
    background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    color:var(--ink);padding:6px 8px;font:inherit;width:100%;
  }
  .fld textarea{resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:12px;line-height:1.5}
  .fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--accent)}
  .pair{display:flex;gap:8px}
  .pair>*{flex:1 1 0;min-width:0}
  .pair input[type=text]{
    background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    color:var(--ink);padding:6px 8px;font:inherit;width:100%;min-width:0;
  }
  .pair input[type=text]:focus{outline:none;border-color:var(--accent)}
  .pair button.small{flex:0 0 auto}
  .tag{
    display:inline-flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--line);
    border-radius:5px;padding:2px 4px 2px 7px;font-size:11px;margin:0 4px 4px 0;
  }
  .tag button{border:0;background:transparent;color:inherit;padding:0 2px;opacity:.6;cursor:pointer;font-size:12px}
  .tag button:hover{opacity:1;background:transparent}
  .code{
    background:#080d18;border:1px solid var(--line);border-radius:6px;padding:9px 10px;
    font:11.5px/1.55 ui-monospace,"Cascadia Mono",Consolas,monospace;color:#cfe0ff;
    white-space:pre;overflow:auto;max-height:52vh;user-select:text;
  }
  .code .k{color:#7dd3fc}
  .code .s{color:#86efac}
  .code .n{color:#fbbf24}
  .code .b{color:#f472b6}
  .kv{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);gap:8px}
  .kv b{color:var(--ink);font-weight:500;font-family:ui-monospace,Consolas,monospace}
  .swatch{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:middle}
  /* ---- chips ---- */
  .chips{
    display:flex;gap:7px;padding:9px 12px;flex-wrap:wrap;background:var(--panel);
    border-top:1px solid var(--line);flex:0 0 auto;max-height:20vh;overflow:auto;align-items:flex-start;
  }
  .chip{display:inline-flex;align-items:center;gap:7px;border-radius:7px;padding:5px 6px 5px 10px;font-size:12px;cursor:pointer;border:1px solid}
  .chip.w{background:rgba(34,197,94,.1);border-color:#1c5c37;color:#86efac}
  .chip.b{background:rgba(244,63,94,.1);border-color:#6b1f34;color:#fda4af}
  .chip.lo{background:rgba(56,189,248,.1);border-color:#1b4f6b;color:#7dd3fc}
  .chip.ch{background:rgba(244,114,182,.1);border-color:#6b2249;color:#f9a8d4}
  .chip.sel{outline:2px solid var(--accent);outline-offset:1px}
  .chip .x{border:0;background:transparent;color:inherit;opacity:.55;cursor:pointer;padding:0 3px;font-size:14px;line-height:1;border-radius:4px}
  .chip .x:hover{opacity:1;background:rgba(255,255,255,.14)}
  .chips .empty{color:var(--dim);font-size:12px;padding:5px 0}
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--accent);color:#fff;
    padding:9px 16px;border-radius:8px;font-weight:600;opacity:0;transition:opacity .18s;pointer-events:none;z-index:9;
  }
  .toast.show{opacity:1}
</style>
</head>
<body>

<div class="bar">
  <span class="brand">Path editor</span>

  <button id="mPaths" class="on">Paths</button>
  <button id="mAreas">Areas</button>
  <button id="mLocs">Locations</button>
  <button id="mChars">Characters</button>
  <button id="mTest">Test</button>

  <span class="sep"></span>
  <button id="addWalk" class="walk">+ Walkable</button>
  <button id="addBlock" class="block">+ Blocked</button>
  <button id="addHotspot">+ Hotspot</button>

  <span class="sep"></span>
  <button id="selectTool" title="V — left click selects instead of creating">Select</button>
  <button id="codeTool" title="J — click anything to see its exported JSON">Code</button>
  <label class="chk"><input type="checkbox" id="chain" checked> Chain</label>
  <label class="chk"><input type="checkbox" id="snap"> Snap</label>
  <label class="chk"><input type="checkbox" id="showImg" checked> Image</label>
  <span class="coord" id="coord">–</span>

  <span class="spring"></span>

  <button id="undo" title="Ctrl+Z">Undo</button>
  <button id="redo" title="Ctrl+Shift+Z">Redo</button>
  <button id="reset">Reset</button>
  <span class="sep"></span>
  <button id="loadGame">Game…</button>
  <button id="saveGame" title="Write this map into the loaded game's HTML">Save to game</button>
  <span class="sep"></span>
  <button id="loadImg">Backdrop…</button>
  <button id="loadJson">Load</button>
  <button id="copyTs">Copy TS</button>
  <button id="copyGame" title="Runtime + this map as one inline script">For game</button>
  <button id="save" class="go">Download JSON</button>
</div>

<div class="layerbar" id="layerbar"></div>

<div class="split">
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="drop" id="drop">
      <b>Drop a map image or an HTML map here</b>
      <span>An <code>.html</code> map renders live behind the canvas at 1:1. A previously saved
      <code>.json</code> loads your work back. You can also start with nothing.</span>
    </div>
    <div class="warn" id="warn"></div>
    <div class="hint" id="hint"></div>
  </div>
  <aside class="insp" id="insp"></aside>
</div>

<div class="chips" id="chips"></div>
<div class="toast" id="toast"></div>

<input type="file" id="fileImg" accept="image/*,.html,.htm" hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>
<input type="file" id="fileFrames" accept="image/*" multiple webkitdirectory directory hidden>
<input type="file" id="fileGame" accept=".html,.htm,text/html" hidden>
<datalist id="mapIds"></datalist>

<script src="navpath.js"></script>
<script>
'use strict';

/* =============================================================== model ==== */

const FORMAT_VERSION = 2;
const AUTOSAVE_KEY = 'path-editor:autosave:v3';
const KNOWN_IDS_KEY = 'path-editor:map-ids:v1';
const LAYER_COLORS = ['#22c55e', '#38bdf8', '#f59e0b', '#a78bfa', '#f43f5e', '#14b8a6', '#eab308', '#ec4899'];

function blankDoc() {
  return {
    version: FORMAT_VERSION,
    id: '',
    image: { name: '', w: 1600, h: 1000 },
    layers: [], activeLayer: '',
    nodes: [], edges: [], areas: [],
    locations: [], characters: [],
    globalRoute: [],
    looplab: null
  };
}
let doc = blankDoc();

let img = null;
let mode = 'paths';                        // paths|areas|locations|characters|test
let chainOn = true, snapOn = false, showImg = true;
let selectTool = false;                    // left click selects, never creates
let codeView = false;                      // inspector shows exported JSON instead of the form

let view = { x: 0, y: 0, s: 1 };
let viewTouched = false;
let mouse = { x: 0, y: 0, inside: false };

let activeNode = null;
let sel = null;                            // {type, ref}
let dragging = null;
let draft = null;                          // {kind:'walkable'|'blocked'|'footprint', points, owner?}
let routeEdit = null;                      // null | {kind:'character', ref} | {kind:'global'}
let test = { a: null, b: null, result: null, smooth: true };
let pendingFrameTarget = null;             // character awaiting a frame folder

const history = [];
let histAt = -1;
let knownIds = [];

const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const clone = o => JSON.parse(JSON.stringify(o));
const round1 = v => Math.round(v * 10) / 10;

function uid(prefix, pool) {
  let n = 0;
  const used = new Set(pool.map(x => x.id));
  while (used.has(prefix + n)) n++;
  return prefix + n;
}
function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 1500);
}

/* -------- transforms: the doc stores PERCENT, the canvas draws in px ------ */

const imgW = () => doc.image.w || 1600;
const imgH = () => doc.image.h || 1000;

function toScreen(px, py) {
  return { x: view.x + (px / 100) * imgW() * view.s,
           y: view.y + (py / 100) * imgH() * view.s };
}
function toPct(sx, sy) {
  return { x: ((sx - view.x) / view.s / imgW()) * 100,
           y: ((sy - view.y) / view.s / imgH()) * 100 };
}
const applySnap = p => snapOn
  ? { x: Math.round(p.x * 2) / 2, y: Math.round(p.y * 2) / 2 }
  : { x: round1(p.x), y: round1(p.y) };

/* ============================================================== layers ==== */

/** Every map has at least one layer, so links always have somewhere to live. */
function ensureLayers() {
  if (!doc.layers || !doc.layers.length) {
    doc.layers = [{ id: 'l0', name: 'Paths', color: LAYER_COLORS[0], visible: true }];
    for (const e of doc.edges) if (!e.layer) e.layer = 'l0';
  }
  for (const l of doc.layers) if (l.visible === undefined) l.visible = true;
  if (!doc.layers.some(l => l.id === doc.activeLayer)) doc.activeLayer = doc.layers[0].id;
}
const layerById = id => doc.layers.find(l => l.id === id) || null;
function layerOf(edge) { return layerById(edge.layer) || doc.layers[0]; }
function edgeVisible(edge) { const l = layerOf(edge); return !l || l.visible !== false; }

function addLayer() {
  const l = {
    id: uid('l', doc.layers),
    name: 'Layer ' + (doc.layers.length + 1),
    color: LAYER_COLORS[doc.layers.length % LAYER_COLORS.length],
    visible: true
  };
  doc.layers.push(l);
  doc.activeLayer = l.id;
  return l;
}
function deleteLayer(l) {
  if (doc.layers.length <= 1) { toast('Keep at least one layer'); return; }
  const fallback = doc.layers.find(x => x !== l).id;
  // Links on a deleted layer move rather than vanish — losing paths silently
  // would be far worse than an unexpected reassignment.
  let moved = 0;
  for (const e of doc.edges) if (e.layer === l.id) { e.layer = fallback; moved++; }
  for (const c of doc.characters) {
    if (c.ai && c.ai.layers) {
      c.ai.layers = c.ai.layers.filter(x => x !== l.id);
      if (!c.ai.layers.length) delete c.ai.layers;
    }
  }
  doc.layers = doc.layers.filter(x => x !== l);
  ensureLayers();
  if (moved) toast(`${moved} link(s) moved to ${layerById(fallback).name}`);
}

/* ============================================================== history === */

/**
 * History holds one snapshot per *distinct* state, as a JSON string.
 *
 * Call sites bracket their mutations with pushHistory() before and after, so
 * the "before" snapshot is nearly always identical to the previous "after".
 * Storing both put duplicate adjacent entries in the stack and made every
 * second undo a silent no-op. Deduplicating here fixes it for every call site
 * at once, and also swallows no-op pushes from fields that fire change events
 * without actually changing.
 */
function pushHistory() {
  const snap = JSON.stringify(doc);
  if (histAt >= 0 && history[histAt] === snap) return;
  history.length = histAt + 1;
  history.push(snap);
  if (history.length > 120) history.shift();
  histAt = history.length - 1;
  autosave(); test.result = null;
}
function undo() { if (histAt > 0) { histAt--; doc = JSON.parse(history[histAt]); afterHistory(); } }
function redo() { if (histAt < history.length - 1) { histAt++; doc = JSON.parse(history[histAt]); afterHistory(); } }
function afterHistory() {
  activeNode = null; sel = null; draft = null; routeEdit = null; test.result = null;
  ensureLayers(); autosave(); refreshAll();
}
function autosave() { try { localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(doc)); } catch (e) {} }

function refreshAll() {
  refreshLayers(); refreshChips(); refreshInspector(); refreshWarnings();
  refreshHint(); refreshToolbar(); refreshIdList(); updateDrop(); draw();
}

/** The drop prompt is only useful on an empty canvas. */
function updateDrop() {
  const empty = !img && !htmlUrl && !doc.nodes.length && !doc.areas.length &&
                !doc.locations.length && !doc.characters.length;
  $('drop').classList.toggle('hide', !empty);
}
function refreshToolbar() {
  $('addWalk').disabled = mode !== 'areas';
  $('addBlock').disabled = mode !== 'areas';
  $('addHotspot').disabled = mode !== 'locations';
  $('selectTool').classList.toggle('on', selectTool);
  $('codeTool').classList.toggle('on', codeView);
}

/* ---------------------------------------------------------- known map ids */

function loadKnownIds() {
  try { knownIds = JSON.parse(localStorage.getItem(KNOWN_IDS_KEY) || '[]'); }
  catch (e) { knownIds = []; }
  if (!Array.isArray(knownIds)) knownIds = [];
}
function rememberId(id) {
  const v = String(id || '').trim();
  if (!v || knownIds.indexOf(v) !== -1) return;
  knownIds.push(v); knownIds.sort();
  try { localStorage.setItem(KNOWN_IDS_KEY, JSON.stringify(knownIds)); } catch (e) {}
  refreshIdList();
}
function refreshIdList() {
  const host = $('mapIds');
  host.innerHTML = '';
  const all = new Set(knownIds);
  if (doc.id) all.add(doc.id);
  for (const b of doc.locations) if (b.interact && b.interact.map) all.add(b.interact.map);
  [...all].sort().forEach(id => {
    const o = document.createElement('option'); o.value = id; host.append(o);
  });
}

/* ============================================================== geometry == */

function distToSegScreen(p, a, b) {
  const vx = b.x - a.x, vy = b.y - a.y, L2 = vx * vx + vy * vy;
  let t = L2 ? ((p.x - a.x) * vx + (p.y - a.y) * vy) / L2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p.x - (a.x + vx * t), p.y - (a.y + vy * t));
}
function pointInPoly(x, y, pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
const nodeById = id => doc.nodes.find(n => n.id === id) || null;

function hitNear(list, sx, sy, r) {
  for (let i = list.length - 1; i >= 0; i--) {
    const s = toScreen(list[i].x, list[i].y);
    if (Math.hypot(s.x - sx, s.y - sy) <= r) return list[i];
  }
  return null;
}
const nodeAt = (sx, sy) => hitNear(doc.nodes, sx, sy, 11);
const locAt = (sx, sy) => hitNear(doc.locations, sx, sy, 13);
const charAt = (sx, sy) => hitNear(doc.characters, sx, sy, 13);

function edgeAt(sx, sy, r = 7) {
  const p = { x: sx, y: sy };
  for (let i = doc.edges.length - 1; i >= 0; i--) {
    const e = doc.edges[i];
    if (!edgeVisible(e)) continue;               // hidden layers are not clickable
    const A = nodeById(e.a), B = nodeById(e.b);
    if (!A || !B) continue;
    if (distToSegScreen(p, toScreen(A.x, A.y), toScreen(B.x, B.y)) <= r) return e;
  }
  return null;
}
function vertexAt(sx, sy, r = 9) {
  const polys = doc.areas.concat(
    doc.locations.filter(b => b.footprint).map(b => ({ points: b.footprint, owner: b })));
  for (let i = polys.length - 1; i >= 0; i--) {
    const p = polys[i];
    for (let k = 0; k < p.points.length; k++) {
      const s = toScreen(p.points[k][0], p.points[k][1]);
      if (Math.hypot(s.x - sx, s.y - sy) <= r) return { points: p.points, index: k, owner: p.owner || p };
    }
  }
  return null;
}
function areaAt(px, py) {
  for (let i = doc.areas.length - 1; i >= 0; i--) if (pointInPoly(px, py, doc.areas[i].points)) return doc.areas[i];
  return null;
}

/* ============================================================ mutations === */

function addNode(p) {
  const n = { id: uid('n', doc.nodes), x: round1(p.x), y: round1(p.y) };
  doc.nodes.push(n); return n;
}
const hasEdge = (a, b) => doc.edges.some(e => (e.a === a && e.b === b) || (e.a === b && e.b === a));
function addEdge(a, b) {
  if (a === b || hasEdge(a, b)) return false;
  doc.edges.push({ a, b, layer: doc.activeLayer });
  return true;
}
function deleteNode(id) {
  doc.nodes = doc.nodes.filter(n => n.id !== id);
  doc.edges = doc.edges.filter(e => e.a !== id && e.b !== id);

/* ========================================================= sprite frames = */

/**
 * Loaded frame images, keyed by character id. Held in memory only — the map
 * file records the folder and file names so the game loads them from its own
 * asset pipeline, exactly like the background image. Embedding hundreds of
 * PNGs as data URIs would make the map file unusable.

const frameCache = new Map();          // id -> {images:[HTMLImageElement], urls:[string]}
let spritePreview = true;
let spriteRAF = null;
const spriteClock = { t0: performance.now() };

const naturalSort = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });

function loadFrames(character, fileList) {
  const files = [...fileList].filter(f => f.type.startsWith('image/'));
  if (!files.length) { toast('No images in that folder'); return; }
  files.sort((a, b) => naturalSort.compare(a.name, b.name));

  // webkitRelativePath is "folder/sub/file.png" — take the deepest folder, so
  // picking a parent directory still records where the frames actually live.
  const rel = files[0].webkitRelativePath || files[0].name;
  const parts = rel.split('/');
  const folder = parts.length > 1 ? parts.slice(0, -1).join('/') : '';

  releaseFrames(character.id);
  const images = [], urls = [];
  let pending = files.length;
  for (const f of files) {
    const url = URL.createObjectURL(f);
    const im = new Image();
    im.onload = im.onerror = () => { if (--pending === 0) { refreshInspector(true); draw(); } };
    im.src = url;
    urls.push(url); images.push(im);
  }
  frameCache.set(character.id, { images, urls });

  const prev = character.sprite || {};
  character.sprite = {
    folder,
    frames: files.map(f => f.name),
    fps: prev.fps || 8,
    scale: prev.scale || 1,
    anchor: prev.anchor || 'feet'

  pushHistory();
  toast(`${files.length} frames from ${folder || 'folder'}`);
  startSpriteLoop();
}

  if (!c) return;

  frameCache.delete(id);

/** Which frame is showing right now, given fps. Matches NavPath.frameAt. */
function frameIndex(sprite, seconds) {

  if (!n) return 0;
  const fps = sprite.fps > 0 ? sprite.fps : 0;
  if (!fps) return 0;
  return Math.floor(seconds * fps) % n;
}

function anyLivePreview() {
  if (!spritePreview) return false;
  for (const c of doc.characters) {
    if (c.sprite && c.sprite.fps > 0 && frameCache.has(c.id)) return true;
  }
  return false;
}
function startSpriteLoop() {
  if (spriteRAF !== null) return;
  const step = () => {
    spriteRAF = null;
    if (!anyLivePreview()) return;
    draw();
    spriteRAF = requestAnimationFrame(step);
  };
  if (anyLivePreview()) spriteRAF = requestAnimationFrame(step);
}

}

/** Nearest path node, aspect-corrected so it is a real distance. */

  const k = imgW() / imgH();
  let best = null, bd = Infinity;
  for (const n of doc.nodes) {
    const d = Math.hypot((n.x - p.x) * k, n.y - p.y);
    if (d < bd) { bd = d; best = n; }

}

/* =============================================================== view ===== */

const VIEW_PAD = 24;       // breathing room around a fitted map
const EDGE_SLACK = 60;     // how far past an edge you may pan, to reach edge nodes

/** Scale at which the whole map fits the viewport, or 0 before layout. */
function fitScale() {
  const W = cv.clientWidth, H = cv.clientHeight;
  if (W < 2 * VIEW_PAD || H < 2 * VIEW_PAD) return 0;
  return Math.min((W - VIEW_PAD * 2) / imgW(), (H - VIEW_PAD * 2) / imgH());
}

function fitView() {
  // A zero-size canvas means the stage has not been laid out yet; fitting
  // against 0 would strand the view off-screen with no way back.
  const s = fitScale();
  if (!s) return false;
  view.s = s;
  clampView();
  return true;
}

/**
 * Keep the map where it belongs.
 *
 * Per axis: if the scaled map is smaller than the viewport on that axis there
 * is nothing to pan to, so it is centred exactly — that is what keeps it
 * centred through a zoom out. Once it is larger than the viewport, "centred"
 * stops meaning anything, so the view is only clamped to stop the map being
 * flung off-screen entirely.
 */
function clampView() {
  const W = cv.clientWidth, H = cv.clientHeight;
  const mw = imgW() * view.s, mh = imgH() * view.s;
  view.x = mw <= W ? (W - mw) / 2
                   : Math.min(EDGE_SLACK, Math.max(W - mw - EDGE_SLACK, view.x));
  view.y = mh <= H ? (H - mh) / 2
                   : Math.min(EDGE_SLACK, Math.max(H - mh - EDGE_SLACK, view.y));
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.max(1, Math.round(cv.clientWidth * dpr));
  cv.height = Math.max(1, Math.round(cv.clientHeight * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!viewTouched) fitView(); else clampView();
  draw();
}

/* =============================================================== render === */

const isSel = o => !!sel && sel.ref === o;

function draw() {
  const W = cv.clientWidth, H = cv.clientHeight;
  ctx.clearRect(0, 0, W, H);

  const o = toScreen(0, 0), e = toScreen(100, 100);
  const htmlBackdrop = doc.image.kind === 'html' && htmlUrl && showImg;
  syncBackdrop();
  ctx.save();
  ctx.beginPath(); ctx.rect(o.x, o.y, e.x - o.x, e.y - o.y); ctx.clip();
  if (img && showImg) {
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, o.x, o.y, e.x - o.x, e.y - o.y);
  } else if (!htmlBackdrop) {
    // Only paint a plate when there is nothing behind the canvas to see.
    ctx.fillStyle = '#0d1424'; ctx.fillRect(o.x, o.y, e.x - o.x, e.y - o.y);
    drawGrid();
  }
  ctx.restore();
  ctx.strokeStyle = '#25324f'; ctx.lineWidth = 1;
  ctx.strokeRect(o.x + .5, o.y + .5, e.x - o.x - 1, e.y - o.y - 1);

  const dim = mode === 'test';
  drawAreas();
  drawFootprints();
  drawEdges(dim);
  drawRoutes();
  drawNodes(dim);
  drawLocations(dim);
  drawCharacters(dim);
  if (draft) drawDraft();
  if (mode === 'test') drawTest();
  drawChainCue();
}

function drawGrid() {
  ctx.strokeStyle = '#16203a'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let p = 0; p <= 100; p += 10) {
    const a = toScreen(p, 0), b = toScreen(p, 100); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
    const c = toScreen(0, p), d = toScreen(100, p); ctx.moveTo(c.x, c.y); ctx.lineTo(d.x, d.y);
  }
  ctx.stroke();
}
function tracePoly(points) {
  ctx.beginPath();
  points.forEach((p, i) => { const s = toScreen(p[0], p[1]); i ? ctx.lineTo(s.x, s.y) : ctx.moveTo(s.x, s.y); });
  ctx.closePath();
}
function drawAreas() {
  for (const a of doc.areas) {
    if (a.points.length < 2) continue;
    const col = a.kind === 'blocked' ? '244,63,94' : '34,197,94';
    tracePoly(a.points);
    ctx.fillStyle = `rgba(${col},${isSel(a) ? .3 : .16})`; ctx.fill();
    ctx.strokeStyle = `rgba(${col},${isSel(a) ? 1 : .85})`;
    ctx.lineWidth = isSel(a) ? 2.5 : 1.6; ctx.stroke();
    if (mode === 'areas') drawVerts(a.points, a.kind === 'blocked' ? '#fda4af' : '#86efac', isSel(a));

}
function drawFootprints() {
  for (const b of doc.locations) {

    // A hotspot wired to an interaction is drawn solid; an inert outline is
    // dashed, so it is obvious at a glance which polygons a player can click.
    const live = b.interact && b.interact.type && b.interact.type !== 'none';
    tracePoly(b.footprint);
    ctx.fillStyle = `rgba(56,189,248,${isSel(b) ? .26 : live ? .16 : .07})`; ctx.fill();
    ctx.strokeStyle = `rgba(56,189,248,${isSel(b) ? 1 : live ? .8 : .4})`;
    ctx.lineWidth = isSel(b) ? 2.5 : 1.6;

}

  ctx.fillStyle = col;
  for (const p of points) {
    const s = toScreen(p[0], p[1]);
    ctx.beginPath(); ctx.arc(s.x, s.y, big ? 4.5 : 3.2, 0, 7); ctx.fill();
  }
}
function drawDraft() {
  const col = draft.kind === 'blocked' ? '244,63,94' : draft.kind === 'footprint' ? '56,189,248' : '34,197,94';
  const pts = draft.points.map(p => toScreen(p[0], p[1]));
  if (!pts.length) return;
  ctx.beginPath();
  pts.forEach((s, i) => (i ? ctx.lineTo(s.x, s.y) : ctx.moveTo(s.x, s.y)));

  ctx.strokeStyle = `rgb(${col})`; ctx.lineWidth = 2;
  ctx.setLineDash([6, 4]); ctx.stroke(); ctx.setLineDash([]);
  if (pts.length > 1) {
    ctx.beginPath();
    pts.forEach((s, i) => (i ? ctx.lineTo(s.x, s.y) : ctx.moveTo(s.x, s.y)));
    ctx.closePath(); ctx.fillStyle = `rgba(${col},.12)`; ctx.fill();
  }
  ctx.fillStyle = `rgb(${col})`;

function hexToRgb(hex) {

  return [parseInt(v.slice(0, 2), 16), parseInt(v.slice(2, 4), 16), parseInt(v.slice(4, 6), 16)].join(',');
}

function drawEdges(dim) {
  ctx.lineCap = 'round';

    if (!edgeVisible(e)) continue;
    const A = nodeById(e.a), B = nodeById(e.b);
    if (!A || !B) continue;
    const a = toScreen(A.x, A.y), b = toScreen(B.x, B.y);
    const rgb = hexToRgb((layerOf(e) || {}).color);
    ctx.strokeStyle = dim ? `rgba(${rgb},.28)` : isSel(e) ? '#ffffff' : `rgba(${rgb},.92)`;
    ctx.lineWidth = isSel(e) ? 5 : 3.2;

      ctx.beginPath(); ctx.arc(mx, my, 9, 0, 7); ctx.fill(); ctx.stroke();

function drawArrow(a, b) {

  const ang = Math.atan2(b.y - a.y, b.x - a.x), L = 8;
  ctx.fillStyle = '#e6fff0';

  ctx.moveTo(mx + Math.cos(ang) * L, my + Math.sin(ang) * L);
  ctx.lineTo(mx + Math.cos(ang + 2.5) * L, my + Math.sin(ang + 2.5) * L);
  ctx.lineTo(mx + Math.cos(ang - 2.5) * L, my + Math.sin(ang - 2.5) * L);

function label(x, y, text, col, size) {
  ctx.font = `${size || 11}px ui-sans-serif,system-ui,sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(4,7,15,.92)';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = col; ctx.fillText(text, x, y);
}

function drawNodes(dim) {
  for (const n of doc.nodes) {
    const s = toScreen(n.x, n.y);
    const big = isSel(n) || n.id === activeNode;
    ctx.beginPath(); ctx.arc(s.x, s.y, big ? 8 : 6.5, 0, 7);
    ctx.fillStyle = dim ? 'rgba(251,191,36,.32)' : isSel(n) ? '#ffffff' : '#fbbf24';
    ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = dim ? 'rgba(0,0,0,.4)' : 'rgba(20,14,0,.75)'; ctx.stroke();
    if (n.id === activeNode && !dim) {
      ctx.beginPath(); ctx.arc(s.x, s.y, 12, 0, 7);
      ctx.strokeStyle = '#a78bfa'; ctx.lineWidth = 2; ctx.stroke();
    }
    if (!dim) {

      if (n.tags && n.tags.length) label(s.x, s.y + 21, n.tags.join(' '), 'rgba(252,211,77,.7)', 9);
    }
  }
}

function drawLocations(dim) {
  for (const b of doc.locations) {
    const s = toScreen(b.x, b.y);
    const pin = b.node ? nodeById(b.node) : nearestNodeTo(b);
    if (pin && !dim) {
      const p = toScreen(pin.x, pin.y);

    ctx.fill();

function drawCharacters(dim) {
  const seconds = (performance.now() - spriteClock.t0) / 1000;
  for (const c of doc.characters) {
    const s = toScreen(c.x, c.y);
    const r = isSel(c) ? 9 : 7.5;

    // A loaded frame sequence stands in for the marker, so you can see the
    // character at its real size against the map.
    const cache = spritePreview ? frameCache.get(c.id) : null;
    if (cache && c.sprite) {
      const im = cache.images[frameIndex(c.sprite, seconds)];
      if (im && im.naturalWidth) {
        // Sprites scale with the map so they keep their footing when zooming.
        const k = (c.sprite.scale || 1) * view.s * (imgH() / 1000);
        const w = im.naturalWidth * k, h = im.naturalHeight * k;
        const oy = c.sprite.anchor === 'center' ? h / 2 : h;
        ctx.save();
        ctx.imageSmoothingEnabled = false;      // frames are usually pixel art
        ctx.globalAlpha = dim ? 0.4 : 1;

        ctx.fillStyle = isSel(c) ? '#ffffff' : '#f472b6'; ctx.fill();

    }

    ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, 7);
    ctx.fillStyle = dim ? 'rgba(244,114,182,.32)' : isSel(c) ? '#ffffff' : '#f472b6';
    ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(32,4,20,.8)'; ctx.stroke();
    if (dim) continue;
    const a = (c.facing || 0) * Math.PI / 180;
    ctx.beginPath();
    ctx.moveTo(s.x + Math.cos(a) * (r + 7), s.y + Math.sin(a) * (r + 7));
    ctx.lineTo(s.x + Math.cos(a + 2.5) * r, s.y + Math.sin(a + 2.5) * r);
    ctx.lineTo(s.x + Math.cos(a - 2.5) * r, s.y + Math.sin(a - 2.5) * r);
    ctx.closePath(); ctx.fillStyle = isSel(c) ? '#ffffff' : '#f472b6'; ctx.fill();

    }
  }
}

function routeStops(list) {
  return (list || []).map(id => {
    const n = nodeById(id);
    if (n) return n;
    const b = doc.locations.find(x => x.dest === id || x.id === id);
    return b || null;

function drawRoutes() {
  const paint = (from, ids, strong, col) => {
    const pts = [from].concat(routeStops(ids));
    if (pts.length < 2) return;
    ctx.beginPath();
    pts.forEach((p, i) => { const s = toScreen(p.x, p.y); i ? ctx.lineTo(s.x, s.y) : ctx.moveTo(s.x, s.y); });
    ctx.strokeStyle = strong ? col.strong : col.weak;
    ctx.lineWidth = strong ? 3 : 2;
    ctx.setLineDash([7, 5]); ctx.stroke(); ctx.setLineDash([]);
    if (!strong) return;
    ctx.font = '10px ui-monospace,monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    routeStops(ids).forEach((p, i) => {
      const s = toScreen(p.x, p.y);
      ctx.fillStyle = col.strong;
      ctx.beginPath(); ctx.arc(s.x, s.y + 14, 7, 0, 7); ctx.fill();
      ctx.fillStyle = '#2a0616'; ctx.fillText(String(i + 1), s.x, s.y + 14);
    });

  const CYAN = { strong: 'rgba(34,211,238,.9)', weak: 'rgba(34,211,238,.35)' };

  // The shared route, anchored at its own first stop.
  const g = routeStops(doc.globalRoute);
  if (g.length > 1) {
    const editingGlobal = routeEdit && routeEdit.kind === 'global';
    paint(g[0], (doc.globalRoute || []).slice(1), !!editingGlobal, CYAN);
  }
  for (const c of doc.characters) {
    const usesGlobal = c.ai && c.ai.routeMode === 'global';
    if (usesGlobal) continue;                       // drawn once, above
    if (!c.route || !c.route.length) continue;
    paint(c, c.route, sel && sel.ref === c, PINK);
  }
}

function drawChainCue() {
  if (mode !== 'paths' || !chainOn || selectTool || !activeNode || !mouse.inside || dragging) return;
  const A = nodeById(activeNode); if (!A) return;
  const a = toScreen(A.x, A.y);
  ctx.strokeStyle = 'rgba(167,139,250,.75)'; ctx.lineWidth = 2;
  ctx.setLineDash([5, 5]);
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
  ctx.setLineDash([]);
}

function drawTest() {
  const dot = (p, col, r) => {
    const s = toScreen(p.x, p.y);
    ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, 7);
    ctx.fillStyle = col; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#04070f'; ctx.stroke();
  };
  const res = test.result;
  if (res && res.ok && res.points.length > 1) {
    ctx.beginPath();
    res.points.forEach((p, i) => { const s = toScreen(p.x, p.y); i ? ctx.lineTo(s.x, s.y) : ctx.moveTo(s.x, s.y); });
    ctx.strokeStyle = 'rgba(34,211,238,.35)'; ctx.lineWidth = 9; ctx.lineJoin = 'round'; ctx.stroke();
    ctx.strokeStyle = '#22d3ee'; ctx.lineWidth = 3; ctx.stroke();
    for (const p of res.points.slice(1, -1)) dot(p, '#22d3ee', 4);
  }
  if (test.a) dot(test.a, '#4ade80', 7);
  if (test.b) dot(test.b, '#f87171', 7);
}

/* ============================================================ layer bar == */

function refreshLayers() {
  const host = $('layerbar');
  host.innerHTML = '';
  host.append(el('span', 'lbl', 'Path layers'));

  for (const l of doc.layers) {
    const count = doc.edges.filter(e => (e.layer || doc.layers[0].id) === l.id).length;
    const pill = el('span', 'lyr' + (l.id === doc.activeLayer ? ' active' : '') + (l.visible === false ? ' hidden' : ''));
    pill.title = 'Click to draw on this layer';

    const eye = el('button', 'eye', l.visible === false ? '◌' : '●');
    eye.title = l.visible === false ? 'Show' : 'Hide';
    eye.onclick = ev => {
      ev.stopPropagation();
      l.visible = l.visible === false;
      pushHistory(); refreshAll();
    };
    const dot = el('span', 'dot'); dot.style.background = l.color;
    const name = el('span', null, l.name);
    const n = el('span', 'n', String(count));

    const x = el('button', 'x', '×');
    x.title = 'Delete layer';
    x.onclick = ev => { ev.stopPropagation(); pushHistory(); deleteLayer(l); pushHistory(); refreshAll(); };

    pill.append(eye, dot, name, n, x);
    pill.onclick = () => {
      doc.activeLayer = l.id;
      sel = { type: 'layer', ref: l };
      refreshAll();
    };
    host.append(pill);
  }

  const add = el('button', 'small', '+ Layer');
  add.onclick = () => { pushHistory(); addLayer(); pushHistory(); refreshAll(); };
  host.append(add);

  const anyHidden = doc.layers.some(l => l.visible === false);
  const all = el('button', 'small', anyHidden ? 'Show all' : 'Solo active');
  all.title = anyHidden ? 'Make every layer visible' : 'Hide every layer except the active one';
  all.onclick = () => {
    pushHistory();
    for (const l of doc.layers) l.visible = anyHidden ? true : l.id === doc.activeLayer;
    pushHistory(); refreshAll();
  };
  host.append(all);
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function field(labelText, input) {
  const f = el('div', 'fld');
  f.append(el('label', null, labelText), input);
  return f;
}
function numBox(value, step, onChange) {
  const i = el('input'); i.type = 'number'; i.step = step; i.value = value;
  i.onchange = () => onChange(parseFloat(i.value));
  return i;
}
function textBox(value, onChange, placeholder) {
  const i = el('input'); i.type = 'text'; i.value = value || '';
  if (placeholder) i.placeholder = placeholder;
  i.oninput = () => onChange(i.value);
  i.onchange = () => { pushHistory(); refreshChips(); refreshWarnings(); draw(); };
  return i;
}
function kv(k, v) {
  const d = el('div', 'kv');
  d.append(el('span', null, k), el('b', null, v));
  return d;
}
function btn(text, cls, onClick) {
  const b = el('button', 'small' + (cls ? ' ' + cls : ''), text);
  b.onclick = onClick;
  return b;
}
function routeEditor(host, get, set, owner) {
  const ids = get() || [];
  if (ids.length) {
    const wrap = el('div');
    ids.forEach((id, i) => {
      const t = el('span', 'tag');
      const known = !!(nodeById(id) || doc.locations.find(b => b.dest === id || b.id === id));
      t.append(document.createTextNode((i + 1) + '. ' + id + (known ? '' : ' ⚠')));
      const x = el('button', null, '×');
      x.onclick = () => { pushHistory(); const c = ids.slice(); c.splice(i, 1); set(c); refreshAll(); };
      t.append(x); wrap.append(t);
    });
    host.append(wrap);
  } else {
    host.append(el('div', 'none', 'No stops yet. Turn on “Pick stops”, then click path nodes or locations in order.'));
  }
  const editingThis = routeEdit && routeEdit.owner === owner;
  const b = btn(editingThis ? 'Done picking' : 'Pick stops', editingThis ? 'on' : null, () => {
    routeEdit = editingThis ? null : { kind: owner === 'global' ? 'global' : 'character', owner, set, get };
    refreshAll();
  });
  host.append(b);
  if (ids.length) host.append(btn('Clear stops', null, () => { pushHistory(); set([]); refreshAll(); }));
}

/* ------------------------------------------------------------ code view - */

/**
 * The exported JSON for whatever is selected — what actually lands in the file,
 * not the editor's in-memory object, so what you read is what ships.
 */
function codeForSelection() {
  const d = exportDoc();
  if (!sel) return { title: 'Whole map', body: d };
  const id = sel.ref.id;
  switch (sel.type) {
    case 'node': return { title: 'Path node', body: d.nodes.find(n => n.id === id) };
    case 'area': return { title: 'Area', body: d.areas.find(a => a.id === id) };
    case 'location': return { title: 'Location', body: d.locations.find(b => b.id === id) };
    case 'character': return { title: 'Character', body: d.characters.find(c => c.id === id) };
    case 'layer': return { title: 'Path layer', body: d.layers.find(l => l.id === id) };
    case 'edge': {
      // Links have no id, so match by position — export preserves doc order.
      const i = doc.edges.indexOf(sel.ref);
      return { title: 'Link', body: i >= 0 ? d.edges[i] : null };
    }
    default: return { title: 'Selection', body: null };
  }
}

/** Minimal JSON syntax colouring — no dependency, no innerHTML of user text. */
function renderJson(host, value) {
  const text = JSON.stringify(value, null, 2);
  const pre = el('pre', 'code');
  const re = /("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false|null)\b|(-?\d+(?:\.\d+)?)/g;
  let last = 0, mm;
  while ((mm = re.exec(text)) !== null) {
    if (mm.index > last) pre.append(document.createTextNode(text.slice(last, mm.index)));
    if (mm[1] !== undefined) {
      pre.append(el('span', mm[2] ? 'k' : 's', mm[1]));
      if (mm[2]) pre.append(document.createTextNode(mm[2]));
    } else if (mm[3] !== undefined) pre.append(el('span', 'b', mm[3]));
    else pre.append(el('span', 'n', mm[4]));
    last = re.lastIndex;
  }
  if (last < text.length) pre.append(document.createTextNode(text.slice(last)));
  host.append(pre);
  return text;
}

function renderCodeView(host) {
  const { title, body } = codeForSelection();
  host.append(el('h2', null, title + ' — JSON'));
  if (body === null || body === undefined) {
    host.append(el('div', 'none', 'Nothing to show for that selection.'));
    return;
  }
  const text = renderJson(host, body);
  host.append(btn('Copy', null, async () => {
    try { await navigator.clipboard.writeText(text); }
    catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
    }
    toast('Copied');
  }));
  host.append(el('div', 'none',
    sel ? 'Click anything else on the map to read its code. Press J to go back to editing.'
        : 'Click something on the map to narrow this down. Press J to go back to editing.'));
}

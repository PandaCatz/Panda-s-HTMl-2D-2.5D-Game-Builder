    }
  }

  function positionAtSpawn(player, spawnId) {
    const spawn = objects.find((object) => object.kind === "spawn" && (!spawnId || object.id === spawnId)) || objects.find((object) => object.kind === "spawn");
    if (!spawn) return false;
    player.x = spawn.x + (spawn.width - player.width) / 2;
    player.y = spawn.y + spawn.height - player.height;
    setObjectZ(player, spawn.supportZ ?? spawn.z ?? 0);
    player.vx = 0;
    player.vy = 0;
    player.grounded = false;
    player.jumpHeld = false;
    player.coyoteTicksRemaining = 0;
    player.jumpBufferTicksRemaining = 0;
    return true;
  }

  function loadMap(id, spawnId) {
    const target = mapById(id);
    if (!target) return false;
    activeMap = target;
    objects = (target.objects || []).map((object) => ({
      ...clone(object),
      vx: 0,
      vy: 0,
      grounded: false,
      jumpHeld: false,
      coyoteTicksRemaining: 0,
      jumpBufferTicksRemaining: 0,
      collected: collectedIds.has(target.id + ":" + object.id),
    }));
    const player = objects.find((object) => object.kind === "player");
    activeTraversal = null;
    if (player && spawnId) positionAtSpawn(player, spawnId);
    won = false;
    emit("map.changed", { mapId: target.id, mapName: target.name, transition: "instant" });
    return true;
  }

  function reset() {
    inputs.clear();
    pressedInputs.clear();
    collectedIds.clear();
    interactionHeld = false;
    portalCooldown = 0;
    activeTraversal = null;
    won = false;
    events.length = 0;
    loadMap(initialMapId, null);
  }

  function respawn(player, spawnId) {
    activeTraversal = null;
    const source = activeMap.objects.find((object) => object.id === player.id);
    if (!positionAtSpawn(player, spawnId)) {
      player.x = source?.x ?? 0;
      player.y = source?.y ?? 0;
      setObjectZ(player, source?.supportZ ?? source?.z ?? 0);
      player.vx = 0;
      player.vy = 0;
    }
    emit("player.respawned", { mapId: activeMap.id });
  }

  function inputActive(...codes) {
    return codes.some((code) => inputs.has(code));
  }

  function solidObjects(player) {
    return objects.filter((object) => object !== player && object.solid && object.collider?.enabled !== false && !object.collider?.trigger);
  }

  function rangesOverlap(firstMin, firstMax, secondMin, secondMax) {
    return firstMin < secondMax && firstMax > secondMin;
  }

  function resolveHorizontal(player, solids, previousBox) {
    const playerCollider = player.collider || { offsetX: 0, offsetY: 0, width: player.width, height: player.height };
    const currentBox = colliderBox(player);
    if (!currentBox || !previousBox) return;
    let resolvedX = null;
    let nearestDistance = Infinity;
    for (const solid of solids) {
      if (solid.collider?.oneWay) continue;
      const box = colliderBox(solid);
      if (!box) continue;
      const zOverlap = currentBox.zMin < box.zMax && currentBox.zMax > box.zMin;
      const verticalOverlap = rangesOverlap(currentBox.y, currentBox.y + currentBox.height, box.y, box.y + box.height);
      if (!zOverlap || !verticalOverlap) continue;
      let candidate = null;
      let distance = Infinity;
      if (player.vx > 0) {
        const crossed = previousBox.x + previousBox.width <= box.x && currentBox.x + currentBox.width >= box.x;
        const penetrated = currentBox.x < box.x + box.width && currentBox.x + currentBox.width > box.x;
        if (crossed || penetrated) {
          candidate = box.x - Number(playerCollider.offsetX || 0) - Number(playerCollider.width ?? player.width);
          distance = Math.max(0, box.x - (previousBox.x + previousBox.width));
        }
      } else if (player.vx < 0) {
        const crossed = previousBox.x >= box.x + box.width && currentBox.x <= box.x + box.width;
        const penetrated = currentBox.x < box.x + box.width && currentBox.x + currentBox.width > box.x;
        if (crossed || penetrated) {
          candidate = box.x + box.width - Number(playerCollider.offsetX || 0);
          distance = Math.max(0, previousBox.x - (box.x + box.width));
        }
      }
      if (candidate != null && distance < nearestDistance) {
        nearestDistance = distance;
        resolvedX = candidate;
      }
    }
    if (resolvedX != null) player.x = resolvedX;
  }

  function resolveVerticalTopdown(player, solids, previousBox) {
    const playerCollider = player.collider || { offsetX: 0, offsetY: 0, width: player.width, height: player.height };
    const currentBox = colliderBox(player);
    if (!currentBox || !previousBox) return;
    let resolvedY = null;
    let nearestDistance = Infinity;
    for (const solid of solids) {
      const box = colliderBox(solid);
      if (!box) continue;
      const zOverlap = currentBox.zMin < box.zMax && currentBox.zMax > box.zMin;
      const horizontalOverlap = rangesOverlap(currentBox.x, currentBox.x + currentBox.width, box.x, box.x + box.width);
      if (!zOverlap || !horizontalOverlap) continue;
      let candidate = null;
      let distance = Infinity;
      if (player.vy > 0) {
        const crossed = previousBox.y + previousBox.height <= box.y && currentBox.y + currentBox.height >= box.y;
        const penetrated = currentBox.y < box.y + box.height && currentBox.y + currentBox.height > box.y;
        if (crossed || penetrated) {
          candidate = box.y - Number(playerCollider.offsetY || 0) - Number(playerCollider.height ?? player.height);
          distance = Math.max(0, box.y - (previousBox.y + previousBox.height));
        }
      } else if (player.vy < 0) {
        const crossed = previousBox.y >= box.y + box.height && currentBox.y <= box.y + box.height;
        const penetrated = currentBox.y < box.y + box.height && currentBox.y + currentBox.height > box.y;
        if (crossed || penetrated) {
          candidate = box.y + box.height - Number(playerCollider.offsetY || 0);
          distance = Math.max(0, previousBox.y - (box.y + box.height));
        }
      }
      if (candidate != null && distance < nearestDistance) {
        nearestDistance = distance;
        resolvedY = candidate;
      }
    }
    if (resolvedY != null) player.y = resolvedY;
  }

  function updateTopdown(player, dt, direction) {
    const solids = solidObjects(player);
    player.vx = direction.x * 250;
    player.vy = direction.y * 250;
    const previousHorizontalBox = colliderBox(player);
    player.x += player.vx * dt;
    resolveHorizontal(player, solids, previousHorizontalBox);
    const previousVerticalBox = colliderBox(player);
    player.y += player.vy * dt;
    resolveVerticalTopdown(player, solids, previousVerticalBox);
  }

  function moveToward(value, target, maximumDelta) {
    if (value < target) return Math.min(target, value + maximumDelta);
    if (value > target) return Math.max(target, value - maximumDelta);
    return target;
  }

  function platformerTuning() {
    return {
      maxRunSpeed: 260,
      groundAcceleration: 2200,
      airAcceleration: 1200,
      groundFriction: 2600,
      jumpVelocity: 570,
      coyoteTicks: 6,
      jumpBufferTicks: 8,
      jumpCutVelocity: 235,
      apexGravityScale: 0.6,
      fallGravityScale: 1.45,
      apexThreshold: 86,
      ...(project.movementTuning || {}),
      ...(activeMap.movementTuning || {}),
    };
  }

  function updatePlatformer(player, dt, direction, jumping, jumpPressed) {
    const solids = solidObjects(player);
    const playerCollider = player.collider || { offsetX: 0, offsetY: 0, width: player.width, height: player.height };
    const tuning = platformerTuning();
    const wasGrounded = Boolean(player.grounded);
    const tickDelta = dt > 0 ? Math.max(1, Math.round(dt * 60)) : 0;
    if (wasGrounded) player.coyoteTicksRemaining = Math.max(1, Number(tuning.coyoteTicks));
    else player.coyoteTicksRemaining = Math.max(0, Number(player.coyoteTicksRemaining || 0) - tickDelta);
    if (jumpPressed) player.jumpBufferTicksRemaining = Math.max(1, Number(tuning.jumpBufferTicks));
    else player.jumpBufferTicksRemaining = Math.max(0, Number(player.jumpBufferTicksRemaining || 0) - tickDelta);

    const targetSpeed = direction.x * Number(tuning.maxRunSpeed);
    const acceleration = wasGrounded ? Number(tuning.groundAcceleration) : Number(tuning.airAcceleration);
    const rate = direction.x === 0 && wasGrounded ? Number(tuning.groundFriction) : acceleration;
    player.vx = moveToward(Number(player.vx || 0), targetSpeed, Math.max(0, rate) * dt);

    const canJump = player.jumpBufferTicksRemaining > 0 && player.coyoteTicksRemaining > 0;
    if (canJump) {
      player.vy = -Math.abs(Number(tuning.jumpVelocity));
      player.grounded = false;
      player.coyoteTicksRemaining = 0;
      player.jumpBufferTicksRemaining = 0;
      emit("player.jumped", { mapId: activeMap.id, objectId: player.id });
    } else if (player.jumpHeld && !jumping && player.vy < -Math.abs(Number(tuning.jumpCutVelocity))) {
      player.vy = -Math.abs(Number(tuning.jumpCutVelocity));
    }
    player.jumpHeld = jumping;
    const previousHorizontalBox = colliderBox(player);
    player.x += player.vx * dt;
    resolveHorizontal(player, solids, previousHorizontalBox);
    const previousBox = colliderBox(player);
    const previousBottom = previousBox ? previousBox.y + previousBox.height : player.y + player.height;
    const previousTop = previousBox ? previousBox.y : player.y;
    const gravityScale = player.vy > 0
      ? Number(tuning.fallGravityScale)
      : Math.abs(Number(player.vy || 0)) <= Number(tuning.apexThreshold)
        ? Number(tuning.apexGravityScale)
        : 1;
    player.vy += Number(activeMap.gravity ?? project.gravity ?? 1500) * Math.max(0, gravityScale) * dt;
    player.y += player.vy * dt;
    player.grounded = false;

    for (const solid of solids) {
      const playerBox = colliderBox(player);
      const solidBox = colliderBox(solid);
      if (!playerBox || !solidBox) continue;
      const horizontal = playerBox.x + playerBox.width > solidBox.x && playerBox.x < solidBox.x + solidBox.width;
      const zOverlap = playerBox.zMin < solidBox.zMax && playerBox.zMax > solidBox.zMin;
      if (!horizontal || !zOverlap) continue;
      const crossedTop = previousBottom <= solidBox.y + 7 && playerBox.y + playerBox.height >= solidBox.y;
      if (player.vy >= 0 && crossedTop) {
        player.y = solidBox.y - Number(playerCollider.offsetY || 0) - Number(playerCollider.height ?? player.height);
        player.vy = 0;
        player.grounded = true;
        setObjectZ(player, solid.supportZ ?? solid.z ?? player.z ?? 0);
      } else if (!solid.collider?.oneWay) {
        const crossedBottom = previousTop >= solidBox.y + solidBox.height - 7 && playerBox.y <= solidBox.y + solidBox.height;
        if (player.vy < 0 && crossedBottom) {
          player.y = solidBox.y + solidBox.height - Number(playerCollider.offsetY || 0);
          player.vy = 0;
        }
      }
    }
    if (!wasGrounded && player.grounded) emit("player.landed", { mapId: activeMap.id, objectId: player.id });
  }

  function traversalGeometry(path) {
    const points = Array.isArray(path?.points) ? path.points : [];
    const segments = [];
    let total = 0;
    for (let index = 0; index < points.length - 1; index += 1) {
      const from = points[index];
      const to = points[index + 1];
      const dx = Number(to.x) - Number(from.x);
      const dy = Number(to.y) - Number(from.y);
      const length = Math.hypot(dx, dy);
      if (length <= 0.000001) continue;
      segments.push({ from, to, dx, dy, length, start: total });
      total += length;
    }
    return { segments, total };
  }

  function traversalSample(geometry, distance) {
    if (!geometry.segments.length) return null;
    const clamped = Math.max(0, Math.min(geometry.total, distance));
    const segment = geometry.segments.find((candidate) => clamped <= candidate.start + candidate.length) || geometry.segments.at(-1);
    const amount = Math.max(0, Math.min(1, (clamped - segment.start) / segment.length));
    return {
      x: Number(segment.from.x) + segment.dx * amount,
      y: Number(segment.from.y) + segment.dy * amount,
      z: Number(segment.from.z || 0) + (Number(segment.to.z || 0) - Number(segment.from.z || 0)) * amount,
      tangentX: segment.dx / segment.length,
      tangentY: segment.dy / segment.length,
    };
  }

  function closestTraversalPoint(path, x, y, z) {
    const geometry = traversalGeometry(path);
    let best = null;
    for (const segment of geometry.segments) {
      const px = x - Number(segment.from.x);
      const py = y - Number(segment.from.y);
      const amount = Math.max(0, Math.min(1, (px * segment.dx + py * segment.dy) / (segment.length * segment.length)));
      const sampleX = Number(segment.from.x) + segment.dx * amount;
      const sampleY = Number(segment.from.y) + segment.dy * amount;
      const sampleZ = Number(segment.from.z || 0) + (Number(segment.to.z || 0) - Number(segment.from.z || 0)) * amount;
      const distance = Math.hypot(x - sampleX, y - sampleY);
      const zDistance = Math.abs(Number(z || 0) - sampleZ);
      if (!best || distance < best.distance) best = { distance, zDistance, sampleZ, pathDistance: segment.start + segment.length * amount, tangentX: segment.dx / segment.length, tangentY: segment.dy / segment.length, geometry };
    }
    return best;
  }

  function positionPlayerOnTraversal(player, sample) {
    const collider = player.collider || { offsetX: 0, offsetY: 0, width: player.width, height: player.height };
    player.x = sample.x - Number(collider.offsetX || 0) - Number(collider.width ?? player.width) / 2;
    player.y = sample.y - Number(collider.offsetY || 0) - Number(collider.height ?? player.height);
    setObjectZ(player, sample.z);
  }

  function tryBeginTraversal(player, direction) {
    const collider = colliderBox(player);
    if (!collider) return false;
    const anchorX = collider.x + collider.width / 2;
    const anchorY = collider.y + collider.height;
    const intendedVx = Number(player.vx || 0) || Number(direction.x || 0) * 260;
    const intendedVy = Number(player.vy || 0) || Number(direction.y || 0) * 260;
    const speed = Math.hypot(intendedVx, intendedVy);
    let selected = null;
    for (const path of activeMap.traversalPaths || []) {
      const closest = closestTraversalPoint(path, anchorX, anchorY, player.z);
      if (!closest || closest.distance > Number(path.entryRadius || 0) || closest.zDistance > Number(path.entryZTolerance ?? 0.5) || speed < Number(path.minimumEntrySpeed || 0)) continue;
      if (!selected || closest.distance < selected.closest.distance) selected = { path, closest };
    }
    if (!selected) return false;
    const dot = intendedVx * selected.closest.tangentX + intendedVy * selected.closest.tangentY;
    const traversalDirection = selected.path.direction === "forward" ? 1 : selected.path.direction === "reverse" ? -1 : dot < 0 ? -1 : 1;
    activeTraversal = {
      pathId: selected.path.id,
      distance: selected.closest.pathDistance,
      direction: traversalDirection,
      speed: Math.max(Number(selected.path.minimumEntrySpeed || 0), speed),
      geometry: selected.closest.geometry,
    };
    const sample = traversalSample(activeTraversal.geometry, activeTraversal.distance);
    if (sample) positionPlayerOnTraversal(player, sample);
    emit("traversal.started", { mapId: activeMap.id, pathId: selected.path.id, direction: traversalDirection });
    return true;
  }

  function bailTraversal(player) {
    if (!activeTraversal) return false;
    const path = (activeMap.traversalPaths || []).find((candidate) => candidate.id === activeTraversal.pathId);
    const pathId = activeTraversal.pathId;
    activeTraversal = null;
    if (path?.bailBehavior === "reset") respawn(player);
    else if (path?.bailBehavior === "launch") player.vy = Number(path.exitImpulse?.y ?? -120);
    emit("traversal.bailed", { mapId: activeMap.id, pathId, behavior: path?.bailBehavior || "drop" });
    return true;
  }

  function updateTraversal(player, dt) {
    if (!activeTraversal) return false;
    const path = (activeMap.traversalPaths || []).find((candidate) => candidate.id === activeTraversal.pathId);
    if (!path) {
      activeTraversal = null;
      return false;
    }
    activeTraversal.speed = Math.min(Number(path.maximumSpeed || activeTraversal.speed), Math.max(0, activeTraversal.speed + Number(path.acceleration || 0) * dt));
    activeTraversal.distance += activeTraversal.speed * dt * activeTraversal.direction;
    const completed = activeTraversal.distance < 0 || activeTraversal.distance > activeTraversal.geometry.total;
    const sample = traversalSample(activeTraversal.geometry, activeTraversal.distance);
    if (sample) {
      positionPlayerOnTraversal(player, sample);
      player.vx = sample.tangentX * activeTraversal.speed * activeTraversal.direction;
      player.vy = sample.tangentY * activeTraversal.speed * activeTraversal.direction;
      player.grounded = false;
    }
    if (completed) {
      const pathId = activeTraversal.pathId;
      const direction = activeTraversal.direction;
      activeTraversal = null;
      player.vx += Number(path.exitImpulse?.x || 0) * direction;
      player.vy += Number(path.exitImpulse?.y || 0);
      emit("traversal.completed", { mapId: activeMap.id, pathId, direction });
    }
    return true;
  }

  function update(rawDt) {
    const dt = Math.max(0, Math.min(Number(rawDt || 0), 0.05));
    portalCooldown = Math.max(0, portalCooldown - dt);
    const player = objects.find((object) => object.kind === "player");
    if (!player) return drainEvents();
    const left = inputActive("ArrowLeft", "KeyA", "left");
    const right = inputActive("ArrowRight", "KeyD", "right");
    const up = inputActive("ArrowUp", "KeyW", "up");
    const down = inputActive("ArrowDown", "KeyS", "down");
    const jumpPressed = ["ArrowUp", "KeyW", "up", "Space", "jump"].some((code) => pressedInputs.has(code));
    const jumping = up || inputActive("Space", "jump") || jumpPressed;
    const interacting = inputActive("KeyE", "interact");
    const interactionPressed = ["KeyE", "interact"].some((code) => pressedInputs.has(code));
    const freshInteraction = interactionPressed || (interacting && !interactionHeld);
    interactionHeld = interacting;
    pressedInputs.clear();
    const direction = { x: Number(right) - Number(left), y: Number(down) - Number(up) };
    let interactionConsumed = false;

    if (activeTraversal && freshInteraction) interactionConsumed = bailTraversal(player);
    if (!activeTraversal && freshInteraction && !interactionConsumed) interactionConsumed = tryBeginTraversal(player, direction);

    if (activeTraversal) updateTraversal(player, dt);
    else if ((activeMap.controlMode ?? project.controlMode) === "topdown") updateTopdown(player, dt, direction);
    else updatePlatformer(player, dt, direction, jumping, jumpPressed);

    const width = Number(activeMap.width ?? project.width);
    const height = Number(activeMap.height ?? project.height);
    player.x = Math.max(0, Math.min(width - player.width, player.x));
    if (player.y > height + 80) respawn(player);
    player.y = Math.max(-80, Math.min(height - player.height, player.y));

    for (const object of objects) {
      if (object.kind === "coin" && !object.collected && overlaps(player, object)) {
        object.collected = true;
        collectedIds.add(activeMap.id + ":" + object.id);
        emit("coin.collected", { mapId: activeMap.id, objectId: object.id, count: collectedIds.size });
      }
      if (object.kind === "hazard" && overlaps(player, object)) respawn(player);
      if (object.kind === "goal" && overlaps(player, object) && !won) {
        won = true;
        emit("goal.reached", { mapId: activeMap.id, objectId: object.id });
      }
    }

    if (freshInteraction && !interactionConsumed && portalCooldown <= 0) {
      const portal = objects.find((object) => object.kind === "portal" && overlaps(player, object));
      if (portal?.targetMapId && mapById(portal.targetMapId)) {
        const transition = portal.transition || "fade";
        const sourceMapId = activeMap.id;
        portalCooldown = 0.35;
        loadMap(portal.targetMapId, portal.targetSpawnId || null);
        const mapEvent = events.at(-1);
        if (mapEvent?.type === "map.changed") mapEvent.transition = transition;
        emit("portal.entered", { sourceMapId, targetMapId: activeMap.id, objectId: portal.id, transition });
      }
    }
    return drainEvents();
  }

  function setInput(code, pressed) {
    if (pressed) {
      if (!inputs.has(code)) pressedInputs.add(code);
      inputs.add(code);
    }
    else inputs.delete(code);
  }

  function drainEvents() {
    return events.splice(0, events.length);
  }

  function depthKey(object, slice) {
    const projection = activeMap.projection ?? project.projection;
    if (projection?.type === "dimetric-2:1") {
      const anchorX = Number(object.x || 0) + Number(object.groundAnchor?.offsetX ?? Number(object.width || 0) / 2);
      const anchorY = Number(object.y || 0) + Number(object.groundAnchor?.offsetY ?? object.height ?? 0);
      return Number(object.depthLayer || 0) * 1_000_000_000 +
        (anchorX + anchorY) * 1024 +
        Number(object.z || 0) * 32 +
        Number(object.depthBias || 0) +
        Number(slice?.depthBias || 0);
    }
    return Number(object.depthLayer || 0) * 1_000_000_000 +
      Number(object.z || 0) * 1_000_000 +
      (Number(object.y || 0) + Number(object.height || 0)) * 100 +
      Number(object.depthBias || 0) +
      Number(slice?.depthBias || 0);
  }

  function renderEntries() {
    const entries = [];
    for (const object of objects) {
      if (object.collected) continue;
      const slices = Array.isArray(object.depthSlices) && object.depthSlices.length ? object.depthSlices : [null];
      for (const slice of slices) entries.push({ object, slice, depth: depthKey(object, slice) });
    }
    return entries.sort((a, b) => a.depth - b.depth || String(a.object.id).localeCompare(String(b.object.id)) || String(a.slice?.id || "").localeCompare(String(b.slice?.id || "")));
  }

  function getState() {
    const player = objects.find((object) => object.kind === "player");
    return {
      activeMapId: activeMap.id,
      mapName: activeMap.name,
      width: Number(activeMap.width ?? project.width),
      height: Number(activeMap.height ?? project.height),
      background: activeMap.background ?? project.background,
      gravity: Number(activeMap.gravity ?? project.gravity),
      controlMode: activeMap.controlMode ?? project.controlMode,
      projection: activeMap.projection ?? project.projection ?? { type: "orthographic", tileWidth: activeMap.grid ?? project.grid, tileHeight: activeMap.grid ?? project.grid },
      collectedCount: collectedIds.size,
      activeTraversalPathId: activeTraversal?.pathId ?? null,
      player: player ? { id: player.id, x: Number(player.x), y: Number(player.y), z: Number(player.z || 0), vx: Number(player.vx || 0), vy: Number(player.vy || 0), grounded: Boolean(player.grounded) } : null,
      won,
    };
  }

  function getObjects() {
    return objects;
  }

  function getTraversalPaths() {
    return activeMap.traversalPaths || [];
  }

  function getNavigation() {
    return activeMap.navigation || { version: 1, activeLayerId: "", layers: [], nodes: [], links: [], areas: [] };
  }

  reset();
  return { update, reset, loadMap, setInput, drainEvents, getState, getObjects, getTraversalPaths, getNavigation, colliderBox, overlaps, renderEntries, respawn };
};
    const engine=createRuntimeModel(project);

    function syncUi(){const state=engine.getState();if(canvas.width!==state.width)canvas.width=state.width;if(canvas.height!==state.height)canvas.height=state.height;score.textContent=String(state.collectedCount);mapName.textContent=state.mapName||state.activeMapId;canvas.setAttribute('aria-label','Agent Quest — '+(state.mapName||state.activeMapId))}
    function announce(message){runtimeStatus.textContent=message}
    function handleEvents(events){events.forEach(function(event){if(event.type==='coin.collected')announce('Collected '+event.count);if(event.type==='player.respawned')announce('Respawned');if(event.type==='goal.reached')announce('Goal reached');if(event.type==='traversal.started')announce('Locked onto '+event.pathId);if(event.type==='traversal.completed')announce('Traversal complete');if(event.type==='traversal.bailed')announce('Traversal released');if(event.type==='map.changed'){syncUi();announce('Entered '+event.mapName);if(event.transition!=='instant')transitionAlpha=1}})}
    function rounded(x,y,width,height,radius){ctx.beginPath();if(typeof ctx.roundRect==='function')ctx.roundRect(x,y,width,height,radius);else ctx.rect(x,y,width,height);ctx.fill()}
    function activeProjection(){const state=engine.getState();return normalizeProjection(state.projection||{type:'orthographic',tileWidth:20,tileHeight:20},state)}
    function projectedPoint(point){const projection=activeProjection();return projection.type==='dimetric-2:1'?worldToScreen({x:Number(point.x||0),y:Number(point.y||0),z:Number(point.z||0)},projection):{x:Number(point.x||0),y:Number(point.y||0)}}
    function objectPlacement(object){const projection=activeProjection();if(projection.type!=='dimetric-2:1')return{x:Number(object.x||0),y:Number(object.y||0)};const anchorX=Number(object.groundAnchor?.offsetX??Number(object.width||0)/2);const anchorY=Number(object.groundAnchor?.offsetY??object.height??0);const screen=worldToScreen({x:Number(object.x||0)+anchorX,y:Number(object.y||0)+anchorY,z:Number(object.z||0)},projection);return{x:screen.x-anchorX,y:screen.y-anchorY}}
    function drawTraversalPaths(){const active=engine.getState().activeTraversalPathId;ctx.save();(engine.getTraversalPaths()||[]).forEach(function(path){if(!active||path.id!==active||!path.points||path.points.length<2)return;const points=path.points.map(projectedPoint);ctx.strokeStyle='#c8ff4d';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);points.slice(1).forEach(function(point){ctx.lineTo(point.x,point.y)});ctx.stroke()});ctx.restore()}
    function drawPrimitive(object){ctx.fillStyle=object.color||'#888';if(object.kind==='coin'){ctx.beginPath();ctx.arc(object.x+object.width/2,object.y+object.height/2,Math.min(object.width,object.height)/2,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#25251e';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='rgba(255,255,255,.55)';ctx.fillRect(object.x+object.width*.32,object.y+object.height*.2,4,7)}else if(object.kind==='hazard'){const count=Math.max(1,Math.round(object.width/24));ctx.beginPath();ctx.moveTo(object.x,object.y+object.height);for(let index=0;index<count;index+=1){const x=object.x+index*(object.width/count);ctx.lineTo(x+object.width/count/2,object.y);ctx.lineTo(x+object.width/count,object.y+object.height)}ctx.closePath();ctx.fill()}else if(object.kind==='spawn'){ctx.globalAlpha=.62;ctx.strokeStyle=object.color;ctx.lineWidth=3;ctx.strokeRect(object.x+5,object.y+5,object.width-10,object.height-5);ctx.globalAlpha=1}else if(object.kind==='portal'){rounded(object.x,object.y,object.width,object.height,Math.min(12,object.width/3));ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=3;ctx.strokeRect(object.x+8,object.y+8,object.width-16,object.height-12)}else if(object.kind==='goal'){ctx.fillRect(object.x+5,object.y,4,object.height);ctx.beginPath();ctx.moveTo(object.x+9,object.y+4);ctx.lineTo(object.x+object.width,object.y+14);ctx.lineTo(object.x+9,object.y+26);ctx.closePath();ctx.fill()}else{rounded(object.x,object.y,object.width,object.height,object.kind==='player'?9:4);if(object.kind==='player'){ctx.fillStyle='#fff';ctx.fillRect(object.x+object.width*.22,object.y+object.height*.25,7,8);ctx.fillRect(object.x+object.width*.62,object.y+object.height*.25,7,8);ctx.fillStyle='#24241f';ctx.fillRect(object.x+object.width*.25,object.y+object.height*.28,3,4);ctx.fillRect(object.x+object.width*.65,object.y+object.height*.28,3,4)}if(object.kind==='platform'){ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(object.x,object.y,object.width,5)}}}
    function sliceBounds(object,slice,asset){if(!slice)return null;const sourceTotal=Math.max(1,Number(asset?.frameHeight||object.height));const sourceY=Math.max(0,Math.min(sourceTotal,Number(slice.sourceY||0)));const sourceHeight=Math.max(0,Math.min(sourceTotal-sourceY,Number(slice.height||sourceTotal)));return {sourceY:sourceY,sourceHeight:sourceHeight,destinationY:object.y+(sourceY/sourceTotal)*object.height,destinationHeight:(sourceHeight/sourceTotal)*object.height}}
    function drawDimetricPlatform(object){const projection=activeProjection();const z=Number(object.z||0);const points=[projectedPoint({x:object.x,y:object.y,z:z}),projectedPoint({x:Number(object.x)+Number(object.width),y:object.y,z:z}),projectedPoint({x:Number(object.x)+Number(object.width),y:Number(object.y)+Number(object.height),z:z}),projectedPoint({x:object.x,y:Number(object.y)+Number(object.height),z:z})];ctx.fillStyle=object.color||'#555';ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);points.slice(1).forEach(function(point){ctx.lineTo(point.x,point.y)});ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=2;ctx.stroke();if(Number(object.collisionHeight||0)>0){const drop=Math.max(5,Number(projection.elevationStep||32)*Math.min(1,Number(object.collisionHeight||1)));ctx.fillStyle='rgba(20,20,24,.34)';ctx.beginPath();ctx.moveTo(points[2].x,points[2].y);ctx.lineTo(points[3].x,points[3].y);ctx.lineTo(points[3].x,points[3].y+drop);ctx.lineTo(points[2].x,points[2].y+drop);ctx.closePath();ctx.fill()}}
    function drawObject(object,slice){ctx.save();const asset=object.assetId&&assets.get(object.assetId);const image=asset&&assetImages.get(asset.id);if(!asset&&activeProjection().type==='dimetric-2:1'&&object.kind==='platform'){drawDimetricPlatform(object);ctx.restore();return}const placement=objectPlacement(object);ctx.translate(placement.x-Number(object.x||0),placement.y-Number(object.y||0));const bounds=sliceBounds(object,slice,asset);if(bounds){ctx.beginPath();ctx.rect(object.x,bounds.destinationY,object.width,bounds.destinationHeight);ctx.clip()}if(asset&&image&&image.complete&&image.naturalWidth){let requested=object.assetFrame||0;if(asset.frames>1&&object.kind==='coin')requested=Math.floor(visualTick/8)%asset.frames;if(asset.frames>1&&object.kind==='player'){const state=engine.getState();requested=state.activeTraversalPathId?Math.min(3,asset.frames-1):Math.abs(Number(object.vy||0))>48?Math.min(2,asset.frames-1):Math.abs(Number(object.vx||0))>18?Math.min(Math.floor(visualTick/8)%2,asset.frames-1):0}const frame=Math.max(0,Math.min(asset.frames-1,requested));const columns=Math.max(1,asset.columns||1);const sx=(frame%columns)*asset.frameWidth;const sy=Math.floor(frame/columns)*asset.frameHeight;if(bounds)ctx.drawImage(image,sx,sy+bounds.sourceY,asset.frameWidth,bounds.sourceHeight,object.x,bounds.destinationY,object.width,bounds.destinationHeight);else ctx.drawImage(image,sx,sy,asset.frameWidth,asset.frameHeight,object.x,object.y,object.width,object.height)}else drawPrimitive(object);ctx.restore()}
    function draw(){visualTick+=1;const state=engine.getState();ctx.fillStyle=state.background||'#111';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.imageSmoothingEnabled=false;drawTraversalPaths();engine.renderEntries().forEach(function(entry){drawObject(entry.object,entry.slice)});transitionAlpha=Math.max(0,transitionAlpha-.08);transition.style.opacity=String(transitionAlpha)}
    function releaseInputs(){heldInputs.forEach(function(code){engine.setInput(code,false)});heldInputs.clear()}
    function setInput(code,pressed){engine.setInput(code,pressed);if(pressed)heldInputs.add(code);else heldInputs.delete(code)}
    function recordFrame(ms){currentFrameMs=ms;frameSamples.push(ms);if(frameSamples.length>240)frameSamples.shift();if(ms>50)longFrames+=1}
    function advanceFixed(seconds){const events=[];accumulator+=Math.max(0,Math.min(Number(seconds||0),.25));let steps=0;while(accumulator>=FIXED_STEP&&steps<MAX_CATCH_UP_STEPS){events.push.apply(events,engine.update(FIXED_STEP));accumulator-=FIXED_STEP;fixedStepCount+=1;steps+=1}if(accumulator>=FIXED_STEP){droppedCatchUpEvents+=1;accumulator%=FIXED_STEP}return events}
    function stepExact(milliseconds){let remaining=Math.max(0,Math.min(1000,Number(milliseconds||0)))/1000;const events=[];while(remaining>.000001){const step=Math.min(remaining,FIXED_STEP);events.push.apply(events,engine.update(step));remaining-=step;fixedStepCount+=1}return events}
    function getPerformance(){const sorted=frameSamples.slice().sort(function(a,b){return a-b});const index=Math.max(0,Math.ceil(sorted.length*.95)-1);return {currentFrameMs:currentFrameMs,p95FrameMs:sorted[index]||0,fixedStepCount:fixedStepCount,droppedCatchUpEvents:droppedCatchUpEvents,longFrames:longFrames,fixedStepHz:60,maximumCatchUpSteps:MAX_CATCH_UP_STEPS}}
    function frame(now){const elapsedMs=Math.max(0,now-last);last=now;recordFrame(elapsedMs);if(!manuallyPaused&&!document.hidden)handleEvents(advanceFixed(elapsedMs/1000));draw();requestAnimationFrame(frame)}
    function reset(){engine.reset();handleEvents(engine.drainEvents());syncUi();announce('Reset');draw()}

    addEventListener('keydown',function(event){setInput(event.code,true);if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyE'].includes(event.code))event.preventDefault()},{passive:false});
    addEventListener('keyup',function(event){setInput(event.code,false)});
    addEventListener('blur',releaseInputs);
    document.addEventListener('visibilitychange',function(){releaseInputs();last=performance.now();accumulator=0;announce(document.hidden?'Paused':'Ready')});
    const touchControls=document.getElementById('touch-controls');
    const mobileTouchQuery=matchMedia('(max-width:700px)');
    function syncTouchControls(){const mobile=mobileTouchQuery.matches;touchControls.hidden=!mobile;touchControls.inert=!mobile;touchControls.setAttribute('aria-hidden',String(!mobile));if(!mobile)releaseInputs()}
    if(typeof mobileTouchQuery.addEventListener==='function')mobileTouchQuery.addEventListener('change',syncTouchControls);else mobileTouchQuery.addListener(syncTouchControls);
    syncTouchControls();
    document.querySelectorAll('[data-input]').forEach(function(button){const codes={left:'left',right:'right',up:'up',down:'down',jump:'jump',interact:'interact'};const code=codes[button.dataset.input];const release=function(){setInput(code,false);button.removeAttribute('data-pressed')};button.addEventListener('pointerdown',function(event){event.preventDefault();button.setPointerCapture(event.pointerId);setInput(code,true);button.setAttribute('data-pressed','true')});button.addEventListener('pointerup',release);button.addEventListener('pointercancel',release);button.addEventListener('lostpointercapture',release)});
    document.getElementById('reset').addEventListener('click',reset);
    const runtimeApi={version:'2.3.0',getState:engine.getState,getObjects:function(){return engine.getObjects().map(function(object){return JSON.parse(JSON.stringify(object))})},getTraversalPaths:function(){return engine.getTraversalPaths().map(function(path){return JSON.parse(JSON.stringify(path))})},getNavigation:function(){return JSON.parse(JSON.stringify(engine.getNavigation()))},getCollisionBox:function(id){const object=typeof id==='string'?engine.getObjects().find(function(candidate){return candidate.id===id}):id;return object?engine.colliderBox(object):null},getPerformance:getPerformance,setInput:setInput,step:function(milliseconds){const emitted=stepExact(milliseconds);handleEvents(emitted);draw();return {events:emitted,state:engine.getState(),performance:getPerformance()}},reset:reset,loadMap:function(mapId,spawnId){const loaded=engine.loadMap(mapId,spawnId||null);handleEvents(engine.drainEvents());syncUi();draw();return loaded},pause:function(){manuallyPaused=true;releaseInputs();announce('Paused')},resume:function(){manuallyPaused=false;last=performance.now();accumulator=0;announce('Ready')}};
    function runRuntimeCommand(command){if(!command||typeof command!=='object'||Array.isArray(command)||typeof command.op!=='string')throw new Error('Runtime command requires a string op.');if(command.op==='get_state')return {ok:true,state:runtimeApi.getState(),performance:runtimeApi.getPerformance()};if(command.op==='get_objects')return {ok:true,objects:runtimeApi.getObjects()};if(command.op==='get_traversal_paths')return {ok:true,paths:runtimeApi.getTraversalPaths()};if(command.op==='get_navigation')return {ok:true,navigation:runtimeApi.getNavigation()};if(command.op==='get_collision_box')return {ok:true,id:command.id,box:runtimeApi.getCollisionBox(String(command.id||''))};if(command.op==='set_input'){runtimeApi.setInput(String(command.code||command.action||''),command.pressed!==false);return {ok:true,state:runtimeApi.getState()}}if(command.op==='step')return {ok:true,...runtimeApi.step(Number(command.deltaMs||command.milliseconds||16.6667))};if(command.op==='reset'){runtimeApi.reset();return {ok:true,state:runtimeApi.getState()}}if(command.op==='load_map'){const loaded=runtimeApi.loadMap(String(command.mapId||''),typeof command.spawnId==='string'?command.spawnId:null);return {ok:loaded,state:runtimeApi.getState()}}if(command.op==='pause'){runtimeApi.pause();return {ok:true,state:{...runtimeApi.getState(),paused:true}}}if(command.op==='resume'){runtimeApi.resume();return {ok:true,state:{...runtimeApi.getState(),paused:false}}}throw new Error('Unknown runtime command: '+command.op)}
    const runtimeBridge=document.getElementById('looplab-runtime-bridge');const runtimeForm=document.getElementById('looplab-runtime-form');const runtimeCommandInput=document.getElementById('looplab-runtime-command');const runtimeResultOutput=document.getElementById('looplab-runtime-result');const runtimeSubmit=document.getElementById('looplab-runtime-submit');
    function executeRuntimeCommand(command){try{return runRuntimeCommand(command)}catch(error){return {ok:false,error:error instanceof Error?error.message:String(error)}}}
    runtimeForm.addEventListener('submit',function(event){event.preventDefault();runtimeSubmit.disabled=true;let result;try{result=executeRuntimeCommand(JSON.parse(runtimeCommandInput.value))}catch(error){result={ok:false,error:error instanceof Error?error.message:String(error)}}runtimeResultOutput.value=JSON.stringify(result,null,2);runtimeSubmit.disabled=false});
    document.addEventListener('looplab:runtime-command',function(event){const detail=event.detail||{};const result=executeRuntimeCommand(detail.command||detail);document.dispatchEvent(new CustomEvent('looplab:runtime-response',{detail:{id:detail.id||null,result:result}}))});
    try{if(Object.isExtensible(window))window.looplabRuntime=runtimeApi}catch(error){}
    handleEvents(engine.drainEvents());syncUi();draw();runtimeBridge.dataset.ready='true';document.dispatchEvent(new CustomEvent('looplab-runtime-ready',{bubbles:true,detail:{version:'2.3.0',mapId:engine.getState().activeMapId}}));requestAnimationFrame(frame);
  </script>
